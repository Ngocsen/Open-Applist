<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Snowboard" />
    <meta name="format-detection" content="telephone=no" />
    
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Snowboard</title>
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #d4bbfc, #8ec5fc, #a78bfa, #7dd3fc);
            background-size: 300% 300%; animation: gradientShift 8s ease infinite;
            height: 100vh; width: 100vw; overflow: hidden;
            display: flex; justify-content: center; align-items: flex-start; padding-top: 50px;
        }
        @keyframes gradientShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }

        .app-container {
            position: relative;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.08), 0 0 40px rgba(139, 92, 246, 0.15);
            width: min(92vw, 360px); padding: 24px;
        }

        .app-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 28px 14px; justify-items: center; justify-content: center; align-items: center; }
        .app-item { display: flex; flex-direction: column; align-items: center; width: 100%; position: relative; cursor: pointer; }

        /* SỬA LỖI: Bỏ overflow: hidden để bóng đổ ra ngoài không bị cắt hình vuông */
        .icon-wrapper { width: 72px; height: 72px; position: relative; border-radius: 16px; background: transparent; overflow: visible !important; margin-bottom: 8px; isolation: isolate; border: none; }
        /* SỬA LỖI: Bỏ !important để JS có thể bo tròn theo yêu cầu */
        .icon-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; background: transparent; border-radius: inherit; }
        .fallback-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 28px; font-weight: bold; z-index: 0; color: #fff; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }

        .app-info { display: flex; align-items: center; justify-content: center; width: 100%; }
        .app-name { font-size: 10px; color: #1e1e2f; opacity: 0.8; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .add-btn { background: rgba(255, 255, 255, 0.25); border: 2px dashed rgba(255, 255, 255, 0.6); color: #4f46e5; font-size: 28px; cursor: pointer; border-radius: 16px !important; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 72px; height: 72px; transition: all 0.2s; }
        .add-btn:active { background: rgba(255, 255, 255, 0.4); transform: scale(0.9); }
        .add-btn .app-name { margin-top: 6px; font-weight: 600; color: #4f46e5; font-size: 11px; }

        /* SỬA LỖI KHUNG SETTING: Đẩy nút lên cao tránh thanh Home, bo tròn tuyệt đối */
        #infoBtn { position: fixed; bottom: calc(30px + env(safe-area-inset-bottom, 20px)); left: 20px; z-index: 999; width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, 0.4); border: 1px solid rgba(255,255,255,0.5); display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; font-size: 18px; color: #1e1e2f; font-family: serif; }
        #infoBtn:active { transform: scale(0.85); background: rgba(255,255,255,0.8); }

        #drawerWrapper { position: fixed; bottom: calc(30px + env(safe-area-inset-bottom, 20px)); right: 20px; z-index: 999; display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,0.25); backdrop-filter: blur(40px); border-radius: 50px; padding: 4px; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
        #drawerContent { display: flex; gap: 6px; overflow: hidden; max-width: 0; opacity: 0; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); white-space: nowrap; }
        #drawerWrapper.open #drawerContent { max-width: 200px; opacity: 1; padding-right: 4px; }

        #drawerToggle, .drawer-btn { width: 40px; height: 40px; border-radius: 50% !important; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; padding: 0; overflow: hidden; background: rgba(255,255,255,0.4); }
        #drawerToggle img, .drawer-btn img { width: 100%; height: 100%; object-fit: cover; border-radius: 50% !important; }
        #drawerToggle:active, .drawer-btn:active { transform: scale(0.85); background: rgba(255,255,255,0.8); }

        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.4); backdrop-filter: blur(10px); opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 1000; display: flex; align-items: center; justify-content: center; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(30px); width: 85%; max-width: 380px; max-height: 70vh; border-radius: 28px; padding: 20px; box-shadow: 0 30px 60px rgba(0,0,0,0.15); overflow-y: auto; }
        .modal-content h3 { font-size: 18px; text-align: center; margin-bottom: 12px; color: #1e1e2f; }
        
        .search-box { width: 100%; padding: 10px 14px; border-radius: 50px; border: none; background: rgba(255,255,255,0.5); margin-bottom: 12px; font-size: 14px; outline: none; }
        .modal-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; }
        .modal-item { display: flex; flex-direction: column; align-items: center; width: 100%; cursor: pointer; }
        .modal-item:active { transform: scale(0.95); }
        .modal-item img { width: 65px; height: 65px; object-fit: cover; border-radius: 16px; background: transparent; }
        .modal-item .fallback-text { width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; font-size: 32px; font-weight: 600; color: #1e1e2f; background: rgba(255,255,255,0.5); border-radius: 16px; }
        .modal-item span { font-size: 11px; text-align: center; color: #333; margin-top: 6px; line-height: 1.2; }

        #loadMoreBtn { display: block; width: 100%; margin-top: 16px; padding: 12px; background: rgba(255,255,255,0.6); border: none; border-radius: 50px; font-weight: 600; color: #555; cursor: pointer; text-align: center; }
        #loadMoreBtn:active { background: rgba(255,255,255,0.9); }
        .close-modal { display: block; width: 100%; margin-top: 16px; padding: 12px; background: rgba(0,0,0,0.05); border: none; border-radius: 50px; font-weight: 600; color: #555; cursor: pointer; text-align: center; }

        .context-menu { position: fixed; z-index: 1001; background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(30px); border-radius: 16px; padding: 8px 0; box-shadow: 0 10px 30px rgba(0,0,0,0.15); border: 1px solid rgba(255, 255, 255, 0.4); min-width: 140px; display: none; transform: scale(0.9); opacity: 0; transition: transform 0.15s, opacity 0.15s; transform-origin: top center; pointer-events: none; }
        .context-menu.active { display: flex; flex-direction: column; transform: scale(1); opacity: 1; pointer-events: auto; }
        .context-menu .menu-item { padding: 10px 16px; font-size: 15px; color: #1c1c1e; cursor: pointer; text-align: center; font-weight: 500; }
        .context-menu .menu-item:active { background: rgba(0, 0, 0, 0.08); }
        .context-menu .menu-item.delete { color: #ff3b30; }

        /* CẬP NHẬT HIỂN THỊ CHO NÚT HƯỚNG BÓNG */
        .direction-container { display: flex; gap: 10px; justify-content: space-between; margin-bottom: 10px; }
        .dir-btn { flex: 1; padding: 10px; background: rgba(255,255,255,0.5); border: 1px solid rgba(0,0,0,0.1); border-radius: 12px; cursor: pointer; font-size: 14px; text-align: center; color: #333; }
        .dir-btn.active { background: #0071e3; color: #fff; border-color: #0071e3; }

        .input-group { margin-bottom: 16px; }
        .input-row { display: flex; align-items: center; gap: 10px; }
        .input-num { width: 80px; padding: 8px; border: 1px solid #ccc; border-radius: 10px; text-align: center; background: rgba(255,255,255,0.8); color: #333; }
        .input-help { font-size: 11px; color: #888; margin-top: 4px; }

        @media (prefers-color-scheme: dark) {
            body { background: linear-gradient(135deg, #1e1b4b, #0f172a, #2e1065, #1e3a8a); background-size: 300% 300%; }
            .app-container { background: rgba(30, 27, 75, 0.3); border: 1px solid rgba(255,255,255,0.05); }
            .app-name, .modal-content h3, .modal-item span { color: #f1f5f9; }
            .modal-content { background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255,255,255,0.05); }
            #infoBtn { color: #f1f5f9; background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.05); }
            #drawerWrapper { background: rgba(30, 27, 75, 0.4); border-color: rgba(255,255,255,0.05); }
            #drawerToggle, .drawer-btn { background: rgba(255,255,255,0.05); }
            .modal-item .fallback-text { background: rgba(255,255,255,0.1); color: #f1f5f9; }
            .context-menu { background: rgba(30, 27, 75, 0.9); border: 1px solid rgba(255,255,255,0.05); }
            .context-menu .menu-item { color: #f1f5f9; }
            .context-menu .menu-item.delete { color: #ff6b5a; }
            .dir-btn { background: rgba(255,255,255,0.1); color: #f1f5f9; border-color: rgba(255,255,255,0.2); }
            .dir-btn.active { background: #0071e3; color: #fff; border-color: #0071e3; }
            .input-num { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.2); }
            .input-help { color: #aaa; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="app-grid" id="appGrid"></div>
</div>

<button id="infoBtn" aria-label="Thông tin">i</button>

<div id="drawerWrapper">
    <div id="drawerContent">
        <button class="drawer-btn" id="btnEffect" aria-label="Cài đặt hiệu ứng"><img src="icons/icon_setting.png" onerror="this.outerHTML='🎨'" /></button>
        <button class="drawer-btn" id="btnReset" aria-label="Khôi phục cài đặt"><img src="icons/icon_reset.png" onerror="this.outerHTML='🔄'" /></button>
        <button class="drawer-btn" id="btnPlugin" aria-label="Plugin"><img src="icons/icon_plugin.png" onerror="this.outerHTML='🔌'" /></button>
    </div>
    <button id="drawerToggle" aria-label="Mở menu"><img src="icons/icon_setting.png" onerror="this.outerHTML='⚙️'" /></button>
</div>

<div class="modal-overlay" id="infoModal">
    <div class="modal-content">
        <h3 id="infoModalTitle">Sentechtipsvn</h3>
        <div class="action-list" style="display: flex; flex-direction: column; gap: 10px;">
            <button class="close-modal" id="btnMail" style="margin-top: 0;">Liên hệ</button>
            <button class="close-modal" id="btnFollow" style="margin-top: 0;">Theo dõi kênh</button>
            <button class="close-modal" id="btnInfoDetails" style="margin-top: 0;">Thông tin</button>
        </div>
        <button class="close-modal" id="closeInfoModalBtn">Đóng</button>
    </div>
</div>

<div class="modal-overlay" id="effectModal">
    <div class="modal-content">
        <h3 id="effectTitle">Hiệu ứng Icon</h3>
        
        <div class="control-group" style="margin-bottom: 16px;">
            <label id="markLabel" style="display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px;">Kiểu Mark</label>
            <select id="markStyle" style="width: 100%; padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.8); font-size: 14px;">
                <option value="0">Liquid Glass</option>
                <option value="1">Crystal Shine</option>
                <option value="2">Holographic</option>
                <option value="3">Matte Dark</option>
                <option value="4">Classic Glossy</option>
            </select>
        </div>

        <div class="control-group" style="margin-bottom: 16px;">
            <label id="shadowLabel" style="display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px;">Hướng đổ bóng</label>
            <div class="direction-container" id="shadowDirectionContainer">
                <button class="dir-btn" data-dir="left">⬅️</button>
                <button class="dir-btn" data-dir="right">➡️</button>
                <button class="dir-btn" data-dir="top">⬆️</button>
                <button class="dir-btn" data-dir="bottom">⬇️</button>
            </div>
        </div>

        <div class="input-group" style="margin-bottom: 16px;">
            <label id="shadowBlurLabel" style="display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px;">Độ đậm nhạt (Blur)</label>
            <input type="number" id="shadowBlurInput" class="input-num" min="1" max="100" value="10" style="width: 100%;">
            <div class="input-help" id="shadowBlurHelper">Chỉ được phép nhập từ 1 đến 100</div>
        </div>

        <div class="input-group" style="margin-bottom: 16px;">
            <label id="shadowOffsetLabel" style="display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px;">Độ xa gần (Offset)</label>
            <input type="number" id="shadowOffsetInput" class="input-num" min="1" max="100" value="10" style="width: 100%;">
            <div class="input-help" id="shadowOffsetHelper">Chỉ được phép nhập từ 1 đến 100</div>
        </div>
        
        <div class="control-group" style="margin-bottom: 16px;">
            <label id="radiusLabel" style="display: block; font-size: 14px; font-weight: 600; color: #333; margin-bottom: 6px;">Kiểu Bo góc Icon</label>
            <select id="radiusStyle" style="width: 100%; padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.5); background: rgba(255,255,255,0.8); font-size: 14px;">
                <option value="0">Squircle (Chuẩn Apple)</option>
                <option value="1">Tròn hoàn toàn</option>
                <option value="2">Vuông nhẹ</option>
            </select>
        </div>
        
        <button class="close-modal" id="saveEffectBtn">Lưu hiệu ứng</button>
        <button class="close-modal" id="closeEffectBtn">Huỷ</button>
    </div>
</div>

<div class="modal-overlay" id="addAppModal">
    <div class="modal-content">
        <h3 id="modalTitle">➕ Thêm ứng dụng</h3>
        <input type="text" class="search-box" id="searchBox" placeholder="Tìm kiếm..." oninput="searchAppsStatic(this.value)" />
        <div class="modal-list" id="modalList"></div>
        <button id="loadMoreBtn">Xem thêm</button>
        <button class="close-modal" id="closeModalBtn">Đóng</button>
    </div>
</div>

<div class="context-menu" id="contextMenu">
    <div class="menu-item" id="menuMoveTop">Đưa lên đầu</div>
    <div class="menu-item" id="menuRename">Đổi tên</div>
    <div class="menu-item delete" id="menuDelete">Xoá</div>
</div>

<script>
    const FALLBACK_DB = { "vn.com.vng.zingalo": {"Name":"Zalo","icon":"https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/a6/fd/de/a6fdde29-8d09-cd61-d8e9-bd5293b9cf21/AppIcon-0-0-1x_U007emarketing-0-8-0-85-220.png/100x100bb.png"} };
    const FALLBACK_SOCIAL = { "links": { "email": "mailto:sentechtips@gmail.com", "social_follow": "https://browse.shortcuty.app/user/Sentechtipsvn", "plugin_shortcut": "https://www.icloud.com/shortcuts/bb6320058d1c46639372d41628ea2432", "app_info": "Snowboard v2.0\nPhát hành bởi: Sentechtipsvn" } };
    const FALLBACK_LANG = { "button": { "add": "Thêm", "close": "Đóng", "cancel": "Huỷ" }, "modal": { "title_add_app": "➕ Thêm ứng dụng", "search_placeholder": "Tìm kiếm...", "max_apps_limit": "Bạn chỉ có thể thêm tối đa {max} ứng dụng." }, "app_menu": { "move_top": "Đưa lên đầu", "rename": "Đổi tên", "delete": "Xoá" }, "messages": { "prompt_rename_app": "Nhập tên mới:", "reset_confirm": "Xoá sạch danh sách?" }, "info_popup": { "title": "Sentechtipsvn", "contact": "Liên hệ", "follow": "Theo dõi kênh", "info": "Thông tin" }, "dock_info": { "app_version": "Snowboard v2.0\nPhát hành bởi: Sentechtipsvn" }, "effects": { "title": "Hiệu ứng Icon", "mark_label": "Kiểu Mark", "shadow_label": "Kiểu Shadow", "radius_label": "Kiểu Bo góc", "mark_options": { "0": "Liquid Glass", "1": "Crystal Shine", "2": "Holographic", "3": "Matte Dark", "4": "Classic Glossy" }, "shadow_options": { "0": "Mềm mại", "1": "Sâu & Nổi", "2": "Phát sáng Neon", "3": "Bóng màu" }, "radius_options": { "0": "Squircle", "1": "Tròn hoàn toàn", "2": "Vuông nhẹ" }, "save": "Lưu hiệu ứng", "cancel": "Huỷ" } };

    let appDatabase = {}, socialData = { links: {} }, langData = {};
    const basePath = '.';
    const sysLang = (navigator.language || 'en-US').replace('-', '_');
    const baseLang = sysLang.split('_')[0];
    const langCandidates = [sysLang, baseLang, 'en_US', 'en'];

    async function getBestLang() {
        for (let lang of langCandidates) {
            try { const res = await fetch(basePath + '/Language/' + lang + '.json'); if (res.ok) return await res.json(); } catch (e) {}
        }
        return null;
    }

    Promise.all([
        fetch(basePath + '/db.json').then(res => res.ok ? res.json() : Promise.reject('DB 404')).catch(() => FALLBACK_DB),
        fetch(basePath + '/system-app.json').then(res => res.ok ? res.json() : Promise.reject('Sys 404')).catch(() => ({})),
        fetch(basePath + '/social.json').then(res => res.ok ? res.json() : Promise.reject('Social 404')).catch(() => FALLBACK_SOCIAL),
        getBestLang()
    ]).then(([db, sysApp, social, lang]) => {
        appDatabase = { ...db, ...sysApp };
        socialData = social || FALLBACK_SOCIAL;
        langData = lang || FALLBACK_LANG;
        initUI();
    }).catch(error => {
        console.warn("Lỗi dữ liệu:", error);
        appDatabase = FALLBACK_DB; socialData = FALLBACK_SOCIAL; langData = FALLBACK_LANG;
        initUI();
    });

    function t(key) {
        if (!langData) return key;
        const keys = key.split('.');
        let val = langData;
        for (let k of keys) { if (val && val[k] !== undefined) val = val[k]; else return key; }
        return typeof val === 'string' ? val : key;
    }

    const STORAGE_KEY = 'myAppList';
    const STORAGE_NAME_KEY = 'myAppNames';
    const STORAGE_CUSTOM_KEY = 'myCustomApps';
    const MARK_KEY = 'effectMarkStyle';
    const SHADOW_KEY = 'effectShadowStyle';
    const RADIUS_KEY = 'effectRadiusStyle';
    
    // CÁC KEY MỚI CHO BÓNG ĐỔ
    const SHADOW_DIRECTION_KEY = 'effectShadowDirection';
    const SHADOW_BLUR_KEY = 'effectShadowBlur';
    const SHADOW_OFFSET_KEY = 'effectShadowOffset';

    const MAX_APPS = 12;
    const INITIAL_DISPLAY_COUNT = 12;
    let currentDisplayCount = INITIAL_DISPLAY_COUNT;
    let currentSelectedAppId = null;
    let isMenuOpen = false;

    const grid = document.getElementById('appGrid');
    const modal = document.getElementById('addAppModal');
    const modalList = document.getElementById('modalList');

    function getCustomApps() {
        const stored = localStorage.getItem(STORAGE_CUSTOM_KEY);
        return stored ? JSON.parse(stored) : [];
    }
    function getCustomNames() {
        const stored = localStorage.getItem(STORAGE_NAME_KEY);
        return stored ? JSON.parse(stored) : {};
    }
    function getSelectedApps() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) { try { const parsed = JSON.parse(stored); if (Array.isArray(parsed)) return parsed; } catch(e) { localStorage.removeItem(STORAGE_KEY); } }
        return ["com.deepseek.chat", "com.facebook.Messenger", "com.facebook.Facebook", "com.burbn.instagram"];
    }
    function saveSelectedApps(ids) { localStorage.setItem(STORAGE_KEY, JSON.stringify(ids)); renderGrid(); closeContextMenu(); }

    function createAppItem(id, data) {
        const div = document.createElement('div'); div.className = 'app-item';
        const useIcon = data.icon && data.icon.trim() !== "";
        let displayName = data.Name; if (getCustomNames()[id]) displayName = getCustomNames()[id];
        let iconSrc = data.icon; if (iconSrc && !iconSrc.startsWith('http') && !iconSrc.startsWith('/')) iconSrc = basePath + '/' + iconSrc;
        
        const mark = localStorage.getItem(MARK_KEY) || '0';
        const shadowDir = localStorage.getItem(SHADOW_DIRECTION_KEY) || 'bottom';
        const shadowBlur = parseInt(localStorage.getItem(SHADOW_BLUR_KEY) || '10');
        const shadowOffset = parseInt(localStorage.getItem(SHADOW_OFFSET_KEY) || '10');
        const radius = localStorage.getItem(RADIUS_KEY) || '0';

        div.innerHTML = `
            <div class="icon-wrapper" data-mark="${mark}" data-shadow-dir="${shadowDir}" data-shadow-blur="${shadowBlur}" data-shadow-offset="${shadowOffset}" data-radius="${radius}">
                <img class="icon-img" src="${useIcon ? iconSrc : ''}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span class="fallback-text" style="display:none;">${displayName.charAt(0).toUpperCase()}</span>
            </div>
            <div class="app-info"><span class="app-name">${displayName}</span></div>
        `;

        const wrapper = div.querySelector('.icon-wrapper');
        const img = div.querySelector('.icon-img');

        // 1. Bo góc
        if (radius === '1') wrapper.style.borderRadius = '50%';
        else if (radius === '2') wrapper.style.borderRadius = '12px';
        else wrapper.style.borderRadius = '16px';
        img.style.borderRadius = wrapper.style.borderRadius;

        // 2. Đổ bóng (Sử dụng Box-shadow để tránh bị cắt, tính toán hướng và độ xa)
        let offsetX = 0, offsetY = 0;
        if (shadowDir === 'left') offsetX = -shadowOffset;
        else if (shadowDir === 'right') offsetX = shadowOffset;
        else if (shadowDir === 'top') offsetY = -shadowOffset;
        else offsetY = shadowOffset;
        
        wrapper.style.boxShadow = `${offsetX}px ${offsetY}px ${shadowBlur}px rgba(0,0,0,0.3)`;

        // 3. Mặt nạ (Sửa lỗi box-shadow bị chặn)
        if (mark === '1') wrapper.style.boxShadow = 'inset 0 0 20px rgba(255,255,255,0.6)';
        else if (mark === '2') wrapper.style.boxShadow = 'inset 0 0 20px rgba(0,255,255,0.6)';
        else if (mark === '3') wrapper.style.boxShadow = 'inset 0 0 20px rgba(0,0,0,0.6)';

        let longPressTimer;
        div.addEventListener('touchstart', (e) => { 
            longPressTimer = setTimeout(() => showContextMenu(id, e), 500); 
        });
        div.addEventListener('touchend', () => clearTimeout(longPressTimer));
        div.addEventListener('touchmove', () => clearTimeout(longPressTimer));
        div.onclick = (e) => { if (longPressTimer) clearTimeout(longPressTimer); openApp(id); };
        return div;
    }

    function renderGrid() {
        grid.innerHTML = '';
        const ids = getSelectedApps();
        const customApps = getCustomApps();
        ids.slice(0, MAX_APPS).forEach(id => {
            let data = appDatabase[id]; if (!data) { const found = customApps.find(a => a.bundleId === id); if (found) data = found; }
            if (!data) return;
            grid.appendChild(createAppItem(id, data));
        });
        if (ids.length < MAX_APPS) {
            const addBtn = document.createElement('div'); addBtn.className = 'app-item add-btn';
            addBtn.innerHTML = `<span style="font-size:28px; color:#4f46e5; line-height:1;">+</span><div class="app-name">${t('button.add')}</div>`;
            addBtn.onclick = () => { currentDisplayCount = INITIAL_DISPLAY_COUNT; renderModal(); modal.classList.add('active'); closeContextMenu(); };
            grid.appendChild(addBtn);
        }
    }

    function renderModal() {
        modalList.innerHTML = '';
        document.getElementById('modalTitle').innerText = t('modal.title_add_app');
        document.getElementById('closeModalBtn').innerText = t('button.close');
        document.getElementById('searchBox').placeholder = t('modal.search_placeholder');

        const selectedIds = getSelectedApps();
        const allAvailableIds = Object.keys(appDatabase).filter(id => !selectedIds.includes(id));
        const displayIds = allAvailableIds.slice(0, currentDisplayCount);

        displayIds.forEach(id => {
            const data = appDatabase[id]; const item = document.createElement('div'); item.className = 'modal-item';
            const useIcon = data.icon && data.icon.trim() !== "";
            let iconSrc = data.icon; if (iconSrc && !iconSrc.startsWith('http') && !iconSrc.startsWith('/')) iconSrc = basePath + '/' + iconSrc;
            item.innerHTML = `<img src="${useIcon ? iconSrc : ''}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span class="fallback-text" style="display:none;">${data.Name.charAt(0).toUpperCase()}</span><span>${data.Name}</span>`;
            item.onclick = () => {
                let current = getSelectedApps();
                if (current.length >= MAX_APPS) { alert(t('modal.max_apps_limit', {max: MAX_APPS})); return; }
                current.push(id); saveSelectedApps(current); closeModal();
            };
            modalList.appendChild(item);
        });

        const loadMoreBtn = document.getElementById('loadMoreBtn');
        if (allAvailableIds.length > currentDisplayCount) {
            loadMoreBtn.style.display = 'block';
            loadMoreBtn.innerText = t('button.view_more') || 'Xem thêm';
        } else {
            loadMoreBtn.style.display = 'none';
        }
    }

    function searchAppsStatic(query) {
        modalList.innerHTML = '';
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        loadMoreBtn.style.display = 'none';
        if (!query.trim()) { renderModal(); return; }
        const keyword = query.trim().toLowerCase();
        let foundIds = [];
        Object.keys(appDatabase).forEach(id => { if (appDatabase[id].Name.toLowerCase().includes(keyword)) foundIds.push(id); });
        if (foundIds.length === 0) { modalList.innerHTML = `<div style="grid-column:1/-1; padding:20px; text-align:center; opacity:0.6;">Không tìm thấy.</div>`; return; }
        foundIds.forEach(id => {
            const data = appDatabase[id]; const item = document.createElement('div'); item.className = 'modal-item';
            const useIcon = data.icon && data.icon.trim() !== "";
            let iconSrc = data.icon; if (iconSrc && !iconSrc.startsWith('http') && !iconSrc.startsWith('/')) iconSrc = basePath + '/' + iconSrc;
            item.innerHTML = `<img src="${useIcon ? iconSrc : ''}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span class="fallback-text" style="display:none;">${data.Name.charAt(0).toUpperCase()}</span><span>${data.Name}</span>`;
            item.onclick = () => {
                let current = getSelectedApps();
                if (current.length >= MAX_APPS) { alert(t('modal.max_apps_limit', {max: MAX_APPS})); return; }
                current.push(id); saveSelectedApps(current); closeModal();
            };
            modalList.appendChild(item);
        });
    }

    function showContextMenu(id, event) {
        const menu = document.getElementById('contextMenu'); currentSelectedAppId = id; isMenuOpen = true;
        document.getElementById('menuMoveTop').onclick = () => { moveAppToTop(id); };
        document.getElementById('menuDelete').onclick = () => { removeApp(id); };
        document.getElementById('menuRename').onclick = () => {
            const currentName = getCustomNames()[id] || (appDatabase[id] ? appDatabase[id].Name : "Ứng dụng");
            const newName = prompt(t('messages.prompt_rename_app'), currentName);
            if (newName !== null) { let names = getCustomNames(); if (newName.trim() !== "") names[id] = newName.trim(); else delete names[id]; localStorage.setItem(STORAGE_NAME_KEY, JSON.stringify(names)); renderGrid(); closeContextMenu(); }
        };
        let clientX = event.clientX || (event.touches && event.touches[0].clientX);
        let clientY = event.clientY || (event.touches && event.touches[0].clientY);
        const menuWidth = 160; let leftPos = clientX - (menuWidth / 2), topPos = clientY - 60;
        if (leftPos < 20) leftPos = 20; if (leftPos + menuWidth > window.innerWidth - 20) leftPos = window.innerWidth - menuWidth - 20; if (topPos < 20) topPos = 20;
        menu.style.left = leftPos + 'px'; menu.style.top = topPos + 'px'; menu.classList.add('active');
    }

    function closeContextMenu() { const menu = document.getElementById('contextMenu'); menu.classList.remove('active'); isMenuOpen = false; currentSelectedAppId = null; }
    document.addEventListener('click', (e) => { if (isMenuOpen && !e.target.closest('.context-menu') && !e.target.closest('.more-btn')) closeContextMenu(); });

    function removeApp(id) {
        let current = getSelectedApps(); current = current.filter(item => item !== id);
        let custom = getCustomApps(); custom = custom.filter(item => item.bundleId !== id);
        localStorage.setItem(STORAGE_CUSTOM_KEY, JSON.stringify(custom));
        saveSelectedApps(current);
    }

    function moveAppToTop(id) { let current = getSelectedApps(); const currentIndex = current.indexOf(id); if (currentIndex > 0) { current.splice(currentIndex, 1); current.unshift(id); saveSelectedApps(current); } }

    function closeModal() { modal.classList.remove('active'); }
    function openApp(bundleId) { const shortcutName = "Open App Launcher"; window.location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(shortcutName) + "&input=text&text=" + encodeURIComponent(bundleId); }

    function initUI() {
        // Info Modal
        document.getElementById('infoModalTitle').innerText = t('info_popup.title');
        document.getElementById('btnMail').innerText = t('info_popup.contact');
        document.getElementById('btnFollow').innerText = t('info_popup.follow');
        document.getElementById('btnInfoDetails').innerText = t('info_popup.info');
        document.getElementById('closeInfoModalBtn').innerText = t('button.close');
        
        document.getElementById('infoBtn').onclick = () => { document.getElementById('infoModal').classList.add('active'); };
        document.getElementById('btnMail').onclick = () => { window.open(socialData.links?.email || 'mailto:sentechtips@gmail.com', '_blank', 'noopener'); };
        document.getElementById('btnFollow').onclick = () => { window.open(socialData.links?.social_follow || 'https://browse.shortcuty.app/user/Sentechtipsvn', '_blank', 'noopener'); };
        document.getElementById('btnInfoDetails').onclick = () => {
            let infoText = socialData.links?.app_info || FALLBACK_LANG.dock_info.app_version;
            alert(infoText); 
            document.getElementById('infoModal').classList.remove('active');
        };
        document.getElementById('closeInfoModalBtn').onclick = () => document.getElementById('infoModal').classList.remove('active');

        // Effect Modal
        document.getElementById('effectTitle').innerText = t('effects.title');
        document.getElementById('markLabel').innerText = t('effects.mark_label');
        document.getElementById('shadowLabel').innerText = t('effects.shadow_direction_label');
        document.getElementById('radiusLabel').innerText = t('effects.radius_label');
        document.getElementById('saveEffectBtn').innerText = t('effects.save');
        document.getElementById('closeEffectBtn').innerText = t('effects.cancel');
        
        // Set nhãn cho các ô nhập mới
        document.getElementById('shadowBlurLabel').innerText = t('effects.shadow_blur_label');
        document.getElementById('shadowBlurHelper').innerText = t('effects.shadow_blur_helper');
        document.getElementById('shadowOffsetLabel').innerText = t('effects.shadow_offset_label');
        document.getElementById('shadowOffsetHelper').innerText = t('effects.shadow_offset_helper');

        document.getElementById('btnEffect').onclick = () => {
            document.getElementById('markStyle').value = localStorage.getItem(MARK_KEY) || '0';
            document.getElementById('radiusStyle').value = localStorage.getItem(RADIUS_KEY) || '0';
            
            // Load các giá trị mới
            const savedDir = localStorage.getItem(SHADOW_DIRECTION_KEY) || 'bottom';
            const savedBlur = parseInt(localStorage.getItem(SHADOW_BLUR_KEY) || '10');
            const savedOffset = parseInt(localStorage.getItem(SHADOW_OFFSET_KEY) || '10');
            
            document.getElementById('shadowBlurInput').value = savedBlur;
            document.getElementById('shadowOffsetInput').value = savedOffset;
            
            // Active nút hướng
            document.querySelectorAll('.dir-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.dir === savedDir);
            });
            
            document.getElementById('effectModal').classList.add('active');
            drawerWrapper.classList.remove('open'); drawerToggle.innerHTML = `<img src="icons/icon_setting.png" />`;
        };
        
        // Xử lý bấm nút hướng bóng
        document.querySelectorAll('.dir-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        document.getElementById('closeEffectBtn').onclick = () => document.getElementById('effectModal').classList.remove('active');
        document.getElementById('saveEffectBtn').onclick = () => {
            localStorage.setItem(MARK_KEY, document.getElementById('markStyle').value);
            localStorage.setItem(RADIUS_KEY, document.getElementById('radiusStyle').value);
            
            // Lưu giá trị mới
            const activeDir = document.querySelector('.dir-btn.active');
            localStorage.setItem(SHADOW_DIRECTION_KEY, activeDir ? activeDir.dataset.dir : 'bottom');
            localStorage.setItem(SHADOW_BLUR_KEY, document.getElementById('shadowBlurInput').value);
            localStorage.setItem(SHADOW_OFFSET_KEY, document.getElementById('shadowOffsetInput').value);
            
            document.getElementById('effectModal').classList.remove('active');
            renderGrid();
        };

        // Drawer
        const drawerToggle = document.getElementById('drawerToggle');
        const drawerWrapper = document.getElementById('drawerWrapper');

        drawerToggle.onclick = () => {
            drawerWrapper.classList.toggle('open');
            if (drawerWrapper.classList.contains('open')) drawerToggle.innerHTML = `<span style="font-size:16px; font-weight:bold;">✕</span>`;
            else drawerToggle.innerHTML = `<img src="icons/icon_setting.png" />`;
        };

        document.getElementById('btnReset').onclick = () => {
            if(confirm(t('messages.reset_confirm'))) {
                localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(STORAGE_NAME_KEY); localStorage.removeItem(STORAGE_CUSTOM_KEY);
                localStorage.removeItem(MARK_KEY); localStorage.removeItem(SHADOW_KEY); localStorage.removeItem(RADIUS_KEY);
                localStorage.removeItem(SHADOW_DIRECTION_KEY); localStorage.removeItem(SHADOW_BLUR_KEY); localStorage.removeItem(SHADOW_OFFSET_KEY);
                renderGrid();
            }
            drawerWrapper.classList.remove('open'); drawerToggle.innerHTML = `<img src="icons/icon_setting.png" />`;
        };

        document.getElementById('btnPlugin').onclick = () => {
            window.open(socialData.links?.plugin_shortcut || 'https://www.icloud.com/shortcuts/bb6320058d1c46639372d41628ea2432', '_blank', 'noopener');
            drawerWrapper.classList.remove('open'); drawerToggle.innerHTML = `<img src="icons/icon_setting.png" />`;
        };

        document.getElementById('loadMoreBtn').onclick = () => { currentDisplayCount += 12; renderModal(); };
        document.getElementById('closeModalBtn').onclick = closeModal;
        modal.onclick = (e) => { if (e.target === modal) closeModal(); };
        document.getElementById('searchBox').oninput = (e) => searchAppsStatic(e.target.value);
        
        renderGrid();
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .catch(err => console.log('Service Worker không được hỗ trợ:', err));
        });
    }
</script>
</body>
</html>
