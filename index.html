<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Snowboard" />
    <meta name="format-detection" content="telephone=no" />
    
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Snowboard</title>

    <!-- [QUÂN SƯ AI] CSS NÂNG CẤP ĐỒNG BỘ GIAO DIỆN THEO LỆNH SẾP -->
    <style>
        /* 1. Nút Setting đơn (khi tắt dock): To bằng các nút trong ngăn kéo */
        #settingsBtn {
            width: 50px !important;
            height: 50px !important;
            border-radius: 50% !important;
            padding: 10px !important;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 2. Nút Setting bên trong Dock: Ép chuẩn kích thước 60x60 bằng các icon khác */
        .dock-setting-btn {
            width: 60px !important;
            height: 60px !important;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
        }
        .dock-setting-btn img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        /* 3. Chỉnh chữ trong popup / modal to bằng nút info, rõ ràng hơn */
        .modal-content button.close-modal, 
        .modal-content .close-modal {
            font-size: 16px !important;
            font-weight: 600 !important;
        }

        /* 4. Tự động nhận diện Dark Mode & Màu chữ Xanh Ngọc cho tiêu đề */
        @media (prefers-color-scheme: dark) {
            .modal-content, #drawerContent {
                background-color: #1c1c1e !important; 
                border: 1px solid rgba(255,255,255,0.1) !important;
                color: #e5e5ea !important;
            }
            .modal-content h3, #drawerContent h3 {
                color: #00bcd4 !important; 
            }
        }
    </style>
</head>
<body>

<!-- Bắt lỗi JavaScript để hiện thông báo nếu có -->
<script>
window.onerror = function(message, source, lineno, colno, error) {
    alert("Lỗi: " + message + " tại dòng " + lineno + " (file " + source + ")");
    return false;
};
</script>

<div class="app-container">
    <div class="app-grid" id="appGrid"></div>
</div>

<!-- Nút Setting nhỏ bo tròn (chỉ hiện khi tắt Dock) -->
<button id="settingsBtn" aria-label="Cài đặt">
    <img src="icons/icon_setting.png" onerror="this.outerHTML='⚙️'" />
</button>

<!-- Khu vực Dock -->
<div id="dockArea" class="dock-container"></div>

<!-- Drawer (ngăn kéo) dùng chung cho cả 2 chế độ -->
<div id="drawerWrapper">
    <div id="drawerContent">
        <button class="drawer-btn" id="btnInfo" aria-label="Thông tin"><img src="icons/icon_info.png" onerror="this.outerHTML='ℹ️'" /></button>
        <button class="drawer-btn" id="btnReset" aria-label="Khôi phục"><img src="icons/icon_reset.png" onerror="this.outerHTML='🔄'" /></button>
        <button class="drawer-btn" id="btnPlugin" aria-label="Plugin"><img src="icons/icon_plugin.png" onerror="this.outerHTML='🔌'" /></button>
        <button class="drawer-btn" id="btnDelete" aria-label="Xoá"><img src="icons/icon_delete.png" onerror="this.outerHTML='🗑️'" /></button>
        <button class="drawer-btn" id="btnSettings" aria-label="Mở cài đặt"><img src="icons/icon_setting.png" onerror="this.outerHTML='⚙️'" /></button>
        <!-- Nút X màu xanh để đóng Drawer -->
        <button id="drawerClose" aria-label="Đóng menu">✕</button>
    </div>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
        <h3 id="settingsTitle">Cài đặt</h3>
        <button class="close-modal" id="openEffectsBtn" style="margin-top: 0;">Icons Effects</button>
        <button class="close-modal" id="openDockBtn">Dock</button>
        <button class="close-modal" id="closeSettingsBtn">Đóng</button>
    </div>
</div>

<div class="modal-overlay" id="dockModal">
    <div class="modal-content">
        <h3 id="dockTitle">Dock</h3>
        <div style="margin-bottom: 10px;">
            <label class="switch"><input type="checkbox" id="dockGlassToggle"><span class="slider"></span></label>
            <span id="dockGlassLabel">Dock Kính trong suốt</span>
        </div>
        <div style="margin-bottom: 10px;">
            <label class="switch"><input type="checkbox" id="dockWoodToggle"><span class="slider"></span></label>
            <span id="dockWoodLabel">Dock Gỗ (iOS 6)</span>
        </div>
        <div style="margin-bottom: 10px;">
            <label class="switch"><input type="checkbox" id="dockBlurToggle"><span class="slider"></span></label>
            <span id="dockBlurLabel">Dock Mờ Đen</span>
        </div>
        <button class="close-modal" id="saveDockBtn">Lưu hiệu ứng</button>
        <button class="close-modal" id="closeDockBtn">Huỷ</button>
    </div>
</div>

<div class="modal-overlay" id="infoModal">
    <div class="modal-content">
        <h3 id="infoModalTitle">Sentechtipsvn</h3>
        <div class="action-list" style="display: flex; flex-direction: column; gap: 10px;">
            <button class="close-modal" id="btnMail" style="margin-top: 0;">Liên hệ</button>
            <button class="close-modal" id="btnFollow" style="margin-top: 0;">Theo dõi kênh</button>
            <button class="close-modal" id="btnInfoDetails" style="margin-top: 0;">Thông tin</button>
        </div>
        <button class="close-modal" id="closeInfoModalBtn">Đóng</button>
    </div>
</div>

<div class="modal-overlay" id="effectModal">
    <div class="modal-content">
        <h3 id="effectTitle">Hiệu ứng Icon</h3>
        <div class="control-group" style="margin-bottom: 16px;">
            <label id="markLabel" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px;">Kiểu Mark</label>
            <select id="markStyle" style="width: 100%; padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.5); background: var(--color-input-bg); font-size: 14px;">
                <option value="0">Liquid Glass</option>
                <option value="1">Crystal Shine</option>
                <option value="2">Holographic</option>
                <option value="3">Matte Dark</option>
                <option value="4">Classic Glossy</option>
            </select>
        </div>
        <div class="control-group" style="margin-bottom: 16px;">
            <label id="shadowLabel" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px;">Hướng đổ bóng</label>
            <div class="direction-container" id="shadowDirectionContainer">
                <button class="dir-btn" data-dir="left">◀︎</button>
                <button class="dir-btn" data-dir="right">►</button>
                <button class="dir-btn" data-dir="center">❖</button>
                <button class="dir-btn" data-dir="top">▲</button>
                <button class="dir-btn" data-dir="bottom">▼</button>
            </div>
        </div>
        <div class="input-group" style="margin-bottom: 16px;">
            <label id="shadowBlurLabel" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px;">Độ đậm nhạt (Blur)</label>
            <input type="number" id="shadowBlurInput" class="input-num" min="1" max="100" value="10">
            <div class="input-help" id="shadowBlurHelper">Chỉ được phép nhập từ 1 đến 100</div>
        </div>
        <div class="input-group" style="margin-bottom: 16px;">
            <label id="shadowOffsetLabel" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px;">Độ xa gần (Offset)</label>
            <input type="number" id="shadowOffsetInput" class="input-num" min="1" max="100" value="10">
            <div class="input-help" id="shadowOffsetHelper">Chỉ được phép nhập từ 1 đến 100</div>
        </div>
        <div class="input-group" style="margin-bottom: 16px;">
            <label id="shadowOpacityLabel" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px;">Độ đậm (Opacity)</label>
            <input type="number" id="shadowOpacityInput" class="input-num" min="1" max="100" value="30">
            <div class="input-help" id="shadowOpacityHelper">Chỉ được phép nhập từ 1 đến 100</div>
        </div>
        <div class="control-group" style="margin-bottom: 16px;">
            <label id="radiusLabel" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px;">Kiểu Bo góc Icon</label>
            <select id="radiusStyle" style="width: 100%; padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.5); background: var(--color-input-bg); font-size: 14px;">
                <option value="0">Squircle (Chuẩn Apple)</option>
                <option value="1">Tròn hoàn toàn</option>
                <option value="2">Vuông nhẹ</option>
            </select>
        </div>
        <button class="close-modal" id="saveEffectBtn">Lưu hiệu ứng</button>
        <button class="close-modal" id="closeEffectBtn">Huỷ</button>
    </div>
</div>

<div class="modal-overlay" id="addAppModal">
    <div class="modal-content">
        <h3 id="modalTitle">➕ Thêm ứng dụng</h3>
        <input type="text" class="search-box" id="searchBox" placeholder="Tìm kiếm..." oninput="searchAppsStatic(this.value)" />
        <div class="modal-list" id="modalList"></div>
        <button id="loadMoreBtn">Xem thêm</button>
        <button class="close-modal" id="closeModalBtn">Đóng</button>
    </div>
</div>

<div class="context-menu" id="contextMenu">
    <div class="menu-item" id="menuMoveTop">Đưa lên đầu</div>
    <div class="menu-item" id="menuRename">Đổi tên</div>
    <div class="menu-item delete" id="menuDelete">Xoá</div>
</div>

<script>
    const FALLBACK_DB = { "vn.com.vng.zingalo": {"Name":"Zalo","icon":"https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/a6/fd/de/a6fdde29-8d09-cd61-d8e9-bd5293b9cf21/AppIcon-0-0-1x_U007emarketing-0-8-0-85-220.png/100x100bb.png"} };
    
    const FALLBACK_LANG = {
        "button": { "add": "Thêm", "close": "Đóng", "cancel": "Huỷ" },
        "modal": { "title_add_app": "➕ Thêm ứng dụng", "search_placeholder": "Tìm kiếm...", "max_apps_limit": "Bạn chỉ được thêm tối đa 12 ứng dụng!", "view_more": "Xem thêm" },
        "effects": {
            "title": "Hiệu ứng Icon",
            "mark_label": "Kiểu Mark",
            "shadow_direction_label": "Hướng đổ bóng",
            "shadow_blur_label": "Độ đậm nhạt (Blur)",
            "shadow_blur_helper": "Chỉ được phép nhập từ 1 đến 100",
            "shadow_offset_label": "Độ xa gần (Offset)",
            "shadow_offset_helper": "Chỉ được phép nhập từ 1 đến 100",
            "shadow_opacity_label": "Độ đậm (Opacity)",
            "shadow_opacity_helper": "Chỉ được phép nhập từ 1 đến 100",
            "radius_label": "Kiểu Bo góc",
            "save": "Lưu hiệu ứng",
            "cancel": "Huỷ",
            "settings": { "title": "Cài đặt", "effects_menu": "Icons Effects", "dock_menu": "Dock" },
            "dock": { "title": "Dock", "glass": "Dock Kính trong suốt", "wood": "Dock Gỗ (iOS 6)", "blur": "Dock Mờ Đen", "save": "Lưu hiệu ứng", "cancel": "Huỷ" }
        },
        "info_popup": { "title": "Sentechtipsvn", "contact": "Liên hệ", "follow": "Theo dõi kênh", "info": "Thông tin" },
        "messages": { "reset_confirm": "Bạn có chắc chắn muốn khôi phục mặc định?", "prompt_rename_app": "Nhập tên mới:" },
        "dock_info": { "app_version": "Snowboard v2.0\nPhát hành bởi: Sentechtipsvn" }
    };

    let appDatabase = {}, socialData = { links: {} }, langData = {};
    const basePath = '.';
    const sysLang = (navigator.language || 'en-US').replace('-', '_');
    const baseLang = sysLang.split('_')[0];
    const langCandidates = [sysLang, baseLang, 'en_US', 'en'];

    async function getBestLang() {
        for (let lang of langCandidates) {
            try { const res = await fetch(basePath + '/Language/' + lang + '.json'); if (res.ok) return await res.json(); } catch (e) {}
        }
        return null;
    }

    Promise.all([
        fetch(basePath + '/db.json').then(res => res.ok ? res.json() : Promise.reject('DB 404')).catch(() => FALLBACK_DB),
        fetch(basePath + '/system-app.json').then(res => res.ok ? res.json() : Promise.reject('Sys 404')).catch(() => ({})),
        fetch(basePath + '/social.json').then(res => res.ok ? res.json() : Promise.reject('Social 404')).catch(() => ({ links: {} })),
        getBestLang()
    ]).then(([db, sysApp, social, lang]) => {
        appDatabase = { ...db, ...sysApp };
        socialData = social || { links: {} };
        langData = lang || FALLBACK_LANG;
        initUI();
    }).catch(error => {
        console.warn("Lỗi dữ liệu:", error);
        appDatabase = FALLBACK_DB; socialData = { links: {} }; langData = FALLBACK_LANG;
        initUI();
    });

    function t(key) {
        if (!langData) return key;
        const keys = key.split('.');
        let val = langData;
        for (let k of keys) { if (val && val[k] !== undefined) val = val[k]; else return key; }
        return typeof val === 'string' ? val : key;
    }

    const STORAGE_KEY = 'myAppList';
    const STORAGE_NAME_KEY = 'myAppNames';
    const STORAGE_CUSTOM_KEY = 'myCustomApps';
    const DOCK_KEY = 'myDockApps';
    const MARK_KEY = 'effectMarkStyle';
    const RADIUS_KEY = 'effectRadiusStyle';
    const SHADOW_DIRECTION_KEY = 'effectShadowDirection';
    const SHADOW_BLUR_KEY = 'effectShadowBlur';
    const SHADOW_OFFSET_KEY = 'effectShadowOffset';
    const SHADOW_OPACITY_KEY = 'effectShadowOpacity';
    const DOCK_STYLE_KEY = 'dockStyle';
    const MAX_APPS = 12;
    const MAX_DOCK_APPS = 3;
    const INITIAL_DISPLAY_COUNT = 12;
    let currentDisplayCount = INITIAL_DISPLAY_COUNT;
    let currentSelectedAppId = null;
    let isMenuOpen = false;
    let isDeleteMode = false;
    let isAddingDock = false;

    const grid = document.getElementById('appGrid');
    const modal = document.getElementById('addAppModal');
    const modalList = document.getElementById('modalList');
    const dockArea = document.getElementById('dockArea');
    const drawerWrapper = document.getElementById('drawerWrapper');
    const settingsBtn = document.getElementById('settingsBtn');
    const DEFAULT_APPS = ['com.deepseek.chat', 'vn.com.vng.zingalo', 'com.facebook.Facebook', 'com.apple.mobilesafari'];

    function getCustomApps() {
        const stored = localStorage.getItem(STORAGE_CUSTOM_KEY);
        return stored ? JSON.parse(stored) : [];
    }
    function getCustomNames() {
        const stored = localStorage.getItem(STORAGE_NAME_KEY);
        return stored ? JSON.parse(stored) : {};
    }
    function getSelectedApps() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) { try { const parsed = JSON.parse(stored); if (Array.isArray(parsed)) return parsed; } catch(e) { localStorage.removeItem(STORAGE_KEY); } }
        return DEFAULT_APPS;
    }
    function saveSelectedApps(ids) { localStorage.setItem(STORAGE_KEY, JSON.stringify(ids)); renderGrid(); closeContextMenu(); }

    function getDockApps() {
        const stored = localStorage.getItem(DOCK_KEY);
        if (stored) { try { const parsed = JSON.parse(stored); if (Array.isArray(parsed)) return parsed; } catch(e) { localStorage.removeItem(DOCK_KEY); } }
        return [];
    }
    function saveDockApps(ids) { localStorage.setItem(DOCK_KEY, JSON.stringify(ids)); renderDock(); }

    function createAppItem(id, data, isDockItem = false) {
        const div = document.createElement('div'); div.className = 'app-item';
        const useIcon = data.icon && data.icon.trim() !== "";
        let displayName = data.Name; if (getCustomNames()[id]) displayName = getCustomNames()[id];
        let iconSrc = data.icon; if (iconSrc && !iconSrc.startsWith('http') && !iconSrc.startsWith('/')) iconSrc = basePath + '/' + iconSrc;
        
        const mark = localStorage.getItem(MARK_KEY) || '0';
        const shadowDir = localStorage.getItem(SHADOW_DIRECTION_KEY) || 'bottom';
        const shadowBlur = parseInt(localStorage.getItem(SHADOW_BLUR_KEY) || '10');
        const shadowOffset = parseInt(localStorage.getItem(SHADOW_OFFSET_KEY) || '10');
        const shadowOpacity = parseInt(localStorage.getItem(SHADOW_OPACITY_KEY) || '30');
        const radius = localStorage.getItem(RADIUS_KEY) || '0';
        
        const size = '60px'; 

        div.innerHTML = `
            <div class="icon-wrapper" style="width:${size}; height:${size};" data-mark="${mark}" data-shadow-dir="${shadowDir}" data-shadow-blur="${shadowBlur}" data-shadow-offset="${shadowOffset}" data-shadow-opacity="${shadowOpacity}" data-radius="${radius}">
                <img class="icon-img" src="${useIcon ? iconSrc : ''}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                <span class="fallback-text" style="display:none;">${displayName.charAt(0).toUpperCase()}</span>
                <div class="mark-overlay" data-mark="${mark}"></div>
                ${isDeleteMode ? '<div class="delete-icon" onclick="deleteApp(\'' + id + '\')">🗑️</div>' : ''}
            </div>
            ${isDockItem ? '' : `<div class="app-info"><span class="app-name">${displayName}</span></div>`}
        `;

        const wrapper = div.querySelector('.icon-wrapper');
        const img = div.querySelector('.icon-img');
        const overlay = div.querySelector('.mark-overlay');

        if (radius === '1') wrapper.style.borderRadius = '50%';
        else if (radius === '2') wrapper.style.borderRadius = '12px';
        else wrapper.style.borderRadius = '16px';
        img.style.borderRadius = wrapper.style.borderRadius;
        overlay.style.borderRadius = wrapper.style.borderRadius;

        let offsetX = 0, offsetY = 0;
        if (shadowDir === 'left') offsetX = -shadowOffset;
        else if (shadowDir === 'right') offsetX = shadowOffset;
        else if (shadowDir === 'top') offsetY = -shadowOffset;
        else if (shadowDir === 'bottom') offsetY = shadowOffset;

        const opacityValue = Math.min(Math.max(shadowOpacity, 1), 100) / 100;
        const shadowColor = `rgba(0,0,0,${opacityValue})`;
        let shadowBox = `${offsetX}px ${offsetY}px ${shadowBlur}px ${shadowColor}`;

        /* [QUÂN SƯ AI] NÂNG CẤP LỚP PHỦ (MARK) TRONG SUỐT VÀ TINH TẾ HƠN */
        if (mark === '0') { 
            overlay.style.background = 'linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.02))';
        } else if (mark === '1') { 
            overlay.style.background = 'linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.3) 100%)';
        } else if (mark === '2') { 
            overlay.style.background = 'conic-gradient(from 180deg, rgba(255,0,255,0.15), rgba(0,255,255,0.15), rgba(255,255,0,0.15), rgba(255,0,255,0.15))';
        } else if (mark === '3') { 
            overlay.style.background = 'rgba(0,0,0,0.15)';
        } else if (mark === '4') { 
            overlay.style.background = 'radial-gradient(circle at 30% 30%, rgba(255,255,255,0.4), rgba(255,255,255,0.05) 70%)';
        }

        wrapper.style.boxShadow = shadowBox;

        let longPressTimer;
        div.addEventListener('touchstart', (e) => { 
            longPressTimer = setTimeout(() => showContextMenu(id, e), 500); 
        });
        div.addEventListener('touchend', () => clearTimeout(longPressTimer));
        div.addEventListener('touchmove', () => clearTimeout(longPressTimer));
        div.onclick = (e) => { if (longPressTimer) clearTimeout(longPressTimer); if (!isDeleteMode) openApp(id); };
        return div;
    }

    function renderDock() {
        const currentStyle = localStorage.getItem(DOCK_STYLE_KEY) || 'none';
        
        if (currentStyle === 'none') {
            document.body.classList.remove('dock-active');
            dockArea.innerHTML = '';
            dockArea.className = 'dock-container';
            dockArea.style.display = 'none'; 
            settingsBtn.style.display = 'flex';
            drawerWrapper.classList.remove('open');
            drawerWrapper.style.display = 'none';
            return;
        } else {
            document.body.classList.add('dock-active');
            dockArea.style.display = 'flex'; 
            settingsBtn.style.display = 'none';
            drawerWrapper.style.display = 'none';
        }
        
        const mainApps = getSelectedApps();
        const dockApps = getDockApps();
        const filteredDockApps = dockApps.filter(id => !mainApps.includes(id)).slice(0, MAX_DOCK_APPS);
        
        dockArea.className = 'dock-container dock-style-' + currentStyle;
        dockArea.innerHTML = '';
        
        filteredDockApps.forEach(id => {
            let data = appDatabase[id];
            if (!data) { const found = getCustomApps().find(a => a.bundleId === id); if (found) data = found; }
            if (!data) return;
            dockArea.appendChild(createAppItem(id, data, true));
        });

        if (filteredDockApps.length < MAX_DOCK_APPS) {
            const addBtn = document.createElement('div'); 
            addBtn.className = 'app-item add-btn';
            addBtn.innerHTML = `<div class="icon-wrapper" style="width:60px; height:60px; margin-bottom:8px; display:flex; align-items:center; justify-content:center;"><span style="font-size:28px; color:#4f46e5;">+</span></div>`;
            addBtn.onclick = () => { 
                isAddingDock = true;
                currentDisplayCount = INITIAL_DISPLAY_COUNT; 
                renderModal(); 
                modal.classList.add('active'); 
                closeContextMenu(); 
            };
            dockArea.appendChild(addBtn);
        }

        const settingsBtnInDock = document.createElement('div');
        settingsBtnInDock.className = 'dock-setting-btn';
        settingsBtnInDock.onclick = toggleDockMenu;
        if (!isDeleteMode) {
            settingsBtnInDock.innerHTML = `<img src="icons/icon_setting.png" onerror="this.outerHTML='⚙️'" />`;
        }
        dockArea.appendChild(settingsBtnInDock);
    }

    function toggleDrawer() {
        if (drawerWrapper.classList.contains('open')) {
            drawerWrapper.classList.remove('open');
            drawerWrapper.style.display = 'none';
            settingsBtn.style.display = 'flex'; 
        } else {
            drawerWrapper.style.display = 'flex';
            drawerWrapper.classList.add('open');
            settingsBtn.style.display = 'none'; 
        }
    }

    function toggleDockMenu() {
        if (drawerWrapper.classList.contains('open')) {
            drawerWrapper.classList.remove('open');
            drawerWrapper.style.display = 'none';
        } else {
            drawerWrapper.style.display = 'flex';
            drawerWrapper.classList.add('open');
        }
    }

    function renderGrid() {
        grid.innerHTML = '';
        const ids = getSelectedApps();
        const customApps = getCustomApps();
        ids.slice(0, MAX_APPS).forEach(id => {
            let data = appDatabase[id]; if (!data) { const found = customApps.find(a => a.bundleId === id); if (found) data = found; }
            if (!data) return;
            grid.appendChild(createAppItem(id, data));
        });
        if (ids.length < MAX_APPS) {
            const addBtn = document.createElement('div'); addBtn.className = 'app-item add-btn';
            addBtn.innerHTML = `<div class="icon-wrapper" style="width:60px; height:60px; margin-bottom:8px; display:flex; align-items:center; justify-content:center;"><span style="font-size:28px; color:#4f46e5;">+</span></div><div class="app-info"><span class="app-name">${t('button.add')}</span></div>`;
            addBtn.onclick = () => { 
                isAddingDock = false;
                currentDisplayCount = INITIAL_DISPLAY_COUNT; 
                renderModal(); 
                modal.classList.add('active'); 
                closeContextMenu(); 
            };
            grid.appendChild(addBtn);
        }
        renderDock();
    }

    function deleteApp(id) {
        let current = getSelectedApps();
        current = current.filter(item => item !== id);
        saveSelectedApps(current);
    }

    function getAllUsedAppIds() {
        return [...getSelectedApps(), ...getDockApps()];
    }

    function renderModal() {
        modalList.innerHTML = '';
        document.getElementById('modalTitle').innerText = t('modal.title_add_app');
        document.getElementById('closeModalBtn').innerText = t('button.close');
        document.getElementById('searchBox').placeholder = t('modal.search_placeholder');

        const usedIds = getAllUsedAppIds();
        const allAvailableIds = Object.keys(appDatabase).filter(id => !usedIds.includes(id));
        const displayIds = allAvailableIds.slice(0, currentDisplayCount);

        displayIds.forEach(id => {
            const data = appDatabase[id]; const item = document.createElement('div'); item.className = 'modal-item';
            const useIcon = data.icon && data.icon.trim() !== "";
            let iconSrc = data.icon; if (iconSrc && !iconSrc.startsWith('http') && !iconSrc.startsWith('/')) iconSrc = basePath + '/' + iconSrc;
            item.innerHTML = `<img src="${useIcon ? iconSrc : ''}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span class="fallback-text" style="display:none;">${data.Name.charAt(0).toUpperCase()}</span><span>${data.Name}</span>`;
            item.onclick = () => {
                if (isAddingDock) {
                    let dockList = getDockApps();
                    if (dockList.length >= MAX_DOCK_APPS) { alert('Dock đã đủ 3 app!'); return; }
                    dockList.push(id);
                    saveDockApps(dockList);
                } else {
                    let current = getSelectedApps();
                    if (current.length >= MAX_APPS) { alert(t('modal.max_apps_limit', {max: MAX_APPS})); return; }
                    current.push(id); saveSelectedApps(current);
                }
                closeModal();
            };
            modalList.appendChild(item);
        });

        const loadMoreBtn = document.getElementById('loadMoreBtn');
        if (allAvailableIds.length > currentDisplayCount) {
            loadMoreBtn.style.display = 'block';
            loadMoreBtn.innerText = t('button.view_more') || 'Xem thêm';
        } else {
            loadMoreBtn.style.display = 'none';
        }
    }

    function searchAppsStatic(query) {
        modalList.innerHTML = '';
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        loadMoreBtn.style.display = 'none';
        if (!query.trim()) { renderModal(); return; }
        const keyword = query.trim().toLowerCase();
        const usedIds = getAllUsedAppIds();
        let foundIds = [];
        Object.keys(appDatabase).forEach(id => { 
            if (!usedIds.includes(id) && appDatabase[id].Name.toLowerCase().includes(keyword)) foundIds.push(id); 
        });
        if (foundIds.length === 0) { modalList.innerHTML = `<div style="grid-column:1/-1; padding:20px; text-align:center; opacity:0.6;">Không tìm thấy.</div>`; return; }
        foundIds.forEach(id => {
            const data = appDatabase[id]; const item = document.createElement('div'); item.className = 'modal-item';
            const useIcon = data.icon && data.icon.trim() !== "";
            let iconSrc = data.icon; if (iconSrc && !iconSrc.startsWith('http') && !iconSrc.startsWith('/')) iconSrc = basePath + '/' + iconSrc;
            item.innerHTML = `<img src="${useIcon ? iconSrc : ''}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span class="fallback-text" style="display:none;">${data.Name.charAt(0).toUpperCase()}</span><span>${data.Name}</span>`;
            item.onclick = () => {
                if (isAddingDock) {
                    let dockList = getDockApps();
                    if (dockList.length >= MAX_DOCK_APPS) { alert('Dock đã đủ 3 app!'); return; }
                    dockList.push(id);
                    saveDockApps(dockList);
                } else {
                    let current = getSelectedApps();
                    if (current.length >= MAX_APPS) { alert(t('modal.max_apps_limit', {max: MAX_APPS})); return; }
                    current.push(id); saveSelectedApps(current);
                }
                closeModal();
            };
            modalList.appendChild(item);
        });
    }

    function showContextMenu(id, event) {
        const menu = document.getElementById('contextMenu'); currentSelectedAppId = id; isMenuOpen = true;
        document.getElementById('menuMoveTop').onclick = () => { moveAppToTop(id); };
        document.getElementById('menuDelete').onclick = () => { removeApp(id); };
        document.getElementById('menuRename').onclick = () => {
            const currentName = getCustomNames()[id] || (appDatabase[id] ? appDatabase[id].Name : "Ứng dụng");
            const newName = prompt(t('messages.prompt_rename_app'), currentName);
            if (newName !== null) { let names = getCustomNames(); if (newName.trim() !== "") names[id] = newName.trim(); else delete names[id]; localStorage.setItem(STORAGE_NAME_KEY, JSON.stringify(names)); renderGrid(); closeContextMenu(); }
        };
        let clientX = event.clientX || (event.touches && event.touches[0].clientX);
        let clientY = event.clientY || (event.touches && event.touches[0].clientY);
        const menuWidth = 160; let leftPos = clientX - (menuWidth / 2), topPos = clientY - 60;
        if (leftPos < 20) leftPos = 20; if (leftPos + menuWidth > window.innerWidth - 20) leftPos = window.innerWidth - menuWidth - 20; if (topPos < 20) topPos = 20;
        menu.style.left = leftPos + 'px'; menu.style.top = topPos + 'px'; menu.classList.add('active');
    }

    function closeContextMenu() { const menu = document.getElementById('contextMenu'); menu.classList.remove('active'); isMenuOpen = false; currentSelectedAppId = null; }
    
    document.addEventListener('click', (e) => {
        if (isMenuOpen && !e.target.closest('.context-menu') && !e.target.closest('.more-btn')) closeContextMenu();
        const drawerWrapper = document.getElementById('drawerWrapper');
        if (drawerWrapper.classList.contains('open') && !e.target.closest('#drawerWrapper') && !e.target.closest('#settingsBtn') && !e.target.closest('.dock-setting-btn')) {
            drawerWrapper.classList.remove('open');
            drawerWrapper.style.display = 'none';
            if (!document.body.classList.contains('dock-active')) settingsBtn.style.display = 'flex'; 
        }
    });

    function removeApp(id) {
        let current = getSelectedApps(); current = current.filter(item => item !== id);
        let custom = getCustomApps(); custom = custom.filter(item => item.bundleId !== id);
        localStorage.setItem(STORAGE_CUSTOM_KEY, JSON.stringify(custom));
        let dockList = getDockApps().filter(item => item !== id);
        saveDockApps(dockList);
        saveSelectedApps(current);
    }

    function moveAppToTop(id) { let current = getSelectedApps(); const currentIndex = current.indexOf(id); if (currentIndex > 0) { current.splice(currentIndex, 1); current.unshift(id); saveSelectedApps(current); } }

    function closeModal() { modal.classList.remove('active'); isAddingDock = false; }
    function openApp(bundleId) { const shortcutName = "Open App Launcher"; window.location.href = "shortcuts://run-shortcut?name=" + encodeURIComponent(shortcutName) + "&input=text&text=" + encodeURIComponent(bundleId); }

    function toggleDeleteMode() {
        isDeleteMode = !isDeleteMode;
        renderGrid();
        const btnDelete = document.getElementById('btnDelete');
        if (isDeleteMode) btnDelete.innerHTML = '✔️';
        else btnDelete.innerHTML = '<img src="icons/icon_delete.png" onerror="this.outerHTML=\'🗑️\'" />';
        drawerWrapper.classList.remove('open');
        drawerWrapper.style.display = 'none';
    }

    function openSettingsModal() {
        drawerWrapper.classList.remove('open');
        drawerWrapper.style.display = 'none';
        document.getElementById('settingsModal').classList.add('active');
    }

    function initUI() {
        document.getElementById('infoModalTitle').innerText = t('info_popup.title') || FALLBACK_LANG.info_popup.title;
        document.getElementById('btnMail').innerText = t('info_popup.contact') || FALLBACK_LANG.info_popup.contact;
        document.getElementById('btnFollow').innerText = t('info_popup.follow') || FALLBACK_LANG.info_popup.follow;
        document.getElementById('btnInfoDetails').innerText = t('info_popup.info') || FALLBACK_LANG.info_popup.info;
        document.getElementById('closeInfoModalBtn').innerText = t('button.close') || FALLBACK_LANG.button.close;
        
        settingsBtn.onclick = toggleDrawer;
        
        document.getElementById('btnInfo').onclick = () => { document.getElementById('infoModal').classList.add('active'); };
        document.getElementById('btnSettings').onclick = openSettingsModal;
        
        document.getElementById('drawerClose').onclick = () => {
            drawerWrapper.classList.remove('open');
            drawerWrapper.style.display = 'none';
            if (!document.body.classList.contains('dock-active')) settingsBtn.style.display = 'flex'; 
        };
        
        document.getElementById('btnMail').onclick = () => { window.open(socialData.links?.email || 'mailto:sentechtips@gmail.com', '_blank', 'noopener'); };
        document.getElementById('btnFollow').onclick = () => { window.open(socialData.links?.social_follow || 'https://browse.shortcuty.app/user/Sentechtipsvn', '_blank', 'noopener'); };
        
        document.getElementById('btnInfoDetails').onclick = () => {
            let infoText = (langData.dock_info?.app_version || FALLBACK_LANG.dock_info.app_version).replace(/\/n/g, '\n');
            alert(infoText); 
            document.getElementById('infoModal').classList.remove('active');
        };
        
        document.getElementById('closeInfoModalBtn').onclick = () => document.getElementById('infoModal').classList.remove('active');

        document.getElementById('closeSettingsBtn').onclick = () => document.getElementById('settingsModal').classList.remove('active');
        document.getElementById('openEffectsBtn').onclick = () => {
            document.getElementById('settingsModal').classList.remove('active');
            document.getElementById('effectModal').classList.add('active');
        };

        document.getElementById('openDockBtn').onclick = () => {
            document.getElementById('settingsModal').classList.remove('active');
            const currentStyle = localStorage.getItem(DOCK_STYLE_KEY) || 'none';
            document.getElementById('dockGlassToggle').checked = currentStyle === 'glass';
            document.getElementById('dockWoodToggle').checked = currentStyle === 'wood';
            document.getElementById('dockBlurToggle').checked = currentStyle === 'blur';
            document.getElementById('dockModal').classList.add('active');
        };

        document.getElementById('closeDockBtn').onclick = () => document.getElementById('dockModal').classList.remove('active');
        
        document.getElementById('saveDockBtn').onclick = () => {
            let dockStyle = 'none';
            if (document.getElementById('dockGlassToggle').checked) dockStyle = 'glass';
            else if (document.getElementById('dockWoodToggle').checked) dockStyle = 'wood';
            else if (document.getElementById('dockBlurToggle').checked) dockStyle = 'blur';
            localStorage.setItem(DOCK_STYLE_KEY, dockStyle);
            document.getElementById('dockModal').classList.remove('active');
            drawerWrapper.classList.remove('open');
            drawerWrapper.style.display = 'none';
            renderGrid();
        };

        document.getElementById('effectTitle').innerText = t('effects.title') || FALLBACK_LANG.effects.title;
        document.getElementById('markLabel').innerText = t('effects.mark_label') || FALLBACK_LANG.effects.mark_label;
        document.getElementById('shadowLabel').innerText = t('effects.shadow_direction_label') || FALLBACK_LANG.effects.shadow_direction_label;
        document.getElementById('radiusLabel').innerText = t('effects.radius_label') || FALLBACK_LANG.effects.radius_label;
        document.getElementById('saveEffectBtn').innerText = t('effects.save') || FALLBACK_LANG.effects.save;
        document.getElementById('closeEffectBtn').innerText = t('effects.cancel') || FALLBACK_LANG.effects.cancel;
        document.getElementById('shadowBlurLabel').innerText = t('effects.shadow_blur_label') || FALLBACK_LANG.effects.shadow_blur_label;
        document.getElementById('shadowBlurHelper').innerText = t('effects.shadow_blur_helper') || FALLBACK_LANG.effects.shadow_blur_helper;
        document.getElementById('shadowOffsetLabel').innerText = t('effects.shadow_offset_label') || FALLBACK_LANG.effects.shadow_offset_label;
        document.getElementById('shadowOffsetHelper').innerText = t('effects.shadow_offset_helper') || FALLBACK_LANG.effects.shadow_offset_helper;
        document.getElementById('shadowOpacityLabel').innerText = t('effects.shadow_opacity_label') || FALLBACK_LANG.effects.shadow_opacity_label;
        document.getElementById('shadowOpacityHelper').innerText = t('effects.shadow_opacity_helper') || FALLBACK_LANG.effects.shadow_opacity_helper;

        document.querySelectorAll('.dir-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.dir-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            });
        });

        document.getElementById('closeEffectBtn').onclick = () => document.getElementById('effectModal').classList.remove('active');
        document.getElementById('saveEffectBtn').onclick = () => {
            localStorage.setItem(MARK_KEY, document.getElementById('markStyle').value);
            localStorage.setItem(RADIUS_KEY, document.getElementById('radiusStyle').value);
            
            const activeDir = document.querySelector('.dir-btn.active');
            localStorage.setItem(SHADOW_DIRECTION_KEY, activeDir ? activeDir.dataset.dir : 'bottom');
            localStorage.setItem(SHADOW_BLUR_KEY, document.getElementById('shadowBlurInput').value);
            localStorage.setItem(SHADOW_OFFSET_KEY, document.getElementById('shadowOffsetInput').value);
            localStorage.setItem(SHADOW_OPACITY_KEY, document.getElementById('shadowOpacityInput').value);
            
            document.getElementById('effectModal').classList.remove('active');
            renderGrid();
        };

        document.getElementById('btnReset').onclick = () => {
            if(confirm(t('messages.reset_confirm') || FALLBACK_LANG.messages.reset_confirm)) {
                localStorage.removeItem(STORAGE_KEY); localStorage.removeItem(STORAGE_NAME_KEY); localStorage.removeItem(STORAGE_CUSTOM_KEY);
                localStorage.removeItem(DOCK_KEY);
                localStorage.removeItem(MARK_KEY); localStorage.removeItem(RADIUS_KEY);
                localStorage.removeItem(SHADOW_DIRECTION_KEY); localStorage.removeItem(SHADOW_BLUR_KEY); localStorage.removeItem(SHADOW_OFFSET_KEY); localStorage.removeItem(SHADOW_OPACITY_KEY);
                localStorage.removeItem(DOCK_STYLE_KEY);
                renderGrid();
            }
            drawerWrapper.classList.remove('open');
            drawerWrapper.style.display = 'none';
        };

        document.getElementById('btnPlugin').onclick = () => {
            window.open(socialData.links?.plugin_shortcut || 'https://www.icloud.com/shortcuts/bb6320058d1c46639372d41628ea2432', '_blank', 'noopener');
            drawerWrapper.classList.remove('open');
            drawerWrapper.style.display = 'none';
        };

        document.getElementById('btnDelete').onclick = toggleDeleteMode;

        document.getElementById('loadMoreBtn').onclick = () => { currentDisplayCount += 12; renderModal(); };
        document.getElementById('closeModalBtn').onclick = closeModal;
        modal.onclick = (e) => { if (e.target === modal) closeModal(); };
        document.getElementById('searchBox').oninput = (e) => searchAppsStatic(e.target.value);
        
        renderGrid();
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            navigator.serviceWorker.register('./sw.js')
                .catch(err => console.log('Service Worker không được hỗ trợ:', err));
        });
    }
</script>
</body>
</html>
