<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Snowboard" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="description" content="Bảng điều khiển tiện ích và Shortcuts của Sentechtipsvn" />
    
    <!-- Icon chuẩn cho Web Clip 180x180 -->
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    
    <link rel="stylesheet" href="./style.css" />
</head>
<body>

<div id="toast" role="status" aria-live="polite">Thông báo</div>

<div class="app-container">
    <div class="app-grid" id="appGrid"></div>
</div>

<!-- Nút Setting góc phải dưới (Tắt Dock) -->
<button id="settingsBtn" aria-label="Mở cài đặt nhanh">
    <img src="icons/icon_setting.png" alt="Cài đặt" onerror="this.outerHTML='⚙️'" />
</button>

<!-- Dock -->
<div id="dockArea" class="dock-container" style="display:none;" aria-label="Dock ứng dụng"></div>

<!-- Ngăn kéo chung (Drawer) -->
<div id="drawerWrapper" role="toolbar" aria-label="Thanh công cụ">
    <div id="drawerContent">
        <button class="drawer-btn" id="btnInfo" aria-label="Thông tin"><img src="icons/icon_info.png" alt="Thông tin" onerror="this.outerHTML='ℹ️'" /></button>
        <button class="drawer-btn" id="btnReset" aria-label="Khôi phục mặc định"><img src="icons/icon_reset.png" alt="Khôi phục" onerror="this.outerHTML='🔄'" /></button>
        <button class="drawer-btn" id="btnPlugin" aria-label="Plugin shortcut"><img src="icons/icon_plugin.png" alt="Plugin" onerror="this.outerHTML='🔌'" /></button>
        <button class="drawer-btn" id="btnDelete" aria-label="Chế độ xóa"><img src="icons/icon_delete.png" alt="Xóa" onerror="this.outerHTML='🗑️'" /></button>
        <button class="drawer-btn" id="btnSettings" aria-label="Cài đặt"><img src="icons/icon_setting.png" alt="Cài đặt" onerror="this.outerHTML='⚙️'" /></button>
        <button id="drawerClose" aria-label="Đóng ngăn kéo">✕</button>
    </div>
</div>

<!-- Các Modal (đã tối ưu aria) -->
<div class="modal-overlay" id="infoModal" role="dialog" aria-modal="true" aria-labelledby="infoTitle">
    <div class="modal-content">
        <h3 id="infoTitle" style="color: #0071e3; font-size: 20px; margin-bottom: 16px;">Sentechtipsvn</h3>
        <div style="background: rgba(255,255,255,0.15); backdrop-filter: blur(20px); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(255,255,255,0.2);">
            <button class="close-modal" id="btnMail" style="margin-top: 0; background: transparent; border: none; color: inherit;">Liên hệ</button>
            <button class="close-modal" id="btnFollow" style="margin-top: 0; background: transparent; border: none; color: inherit;">Theo dõi kênh</button>
            <button class="close-modal" id="btnInfoDetails" style="margin-top: 0; background: transparent; border: none; color: inherit;">Thông tin</button>
        </div>
        <button class="close-modal" id="closeInfoModal" style="margin-top: 16px;">Đóng</button>
    </div>
</div>

<!-- Các modal còn lại giữ nguyên cấu trúc như cũ, chỉ thêm aria-label nếu cần -->
<div class="modal-overlay" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="modal-content">
        <h3 id="settingsTitle">Cài đặt</h3>
        <button class="close-modal" id="openEffectsBtn">Icons Effects</button>
        <button class="close-modal" id="openDockBtn">Dock</button>
        <button class="close-modal" id="openLabelsBtn">Quản lý Ứng dụng</button>
        <div style="display: flex; gap: 10px; margin-top: 16px;">
            <button class="close-modal" id="exportBtn" style="margin-top: 0; background: rgba(0, 188, 212, 0.2); color: #00bcd4;">📤 Xuất Cấu Hình</button>
            <button class="close-modal" id="importBtn" style="margin-top: 0; background: rgba(52, 199, 89, 0.2); color: #34c759;">📥 Nhập</button>
        </div>
        <button class="close-modal" id="closeSettingsBtn">Đóng</button>
    </div>
</div>

<div class="modal-overlay" id="labelsModal" role="dialog" aria-modal="true">
    <div class="modal-content">
        <h3>Quản lý Ứng dụng</h3>
        <div style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;"><span>Ẩn tên ứng dụng</span> <label class="switch"><input type="radio" name="labelToggle" id="hideLabelsToggle" aria-label="Ẩn tên"><span class="slider"></span></label></div>
        <div style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;"><span>Hiện tên ứng dụng</span> <label class="switch"><input type="radio" name="labelToggle" id="showLabelsToggle" checked aria-label="Hiện tên"><span class="slider"></span></label></div>
        <div style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(150,150,150,0.2); padding-top: 10px;"><span>Chế độ Đổi tên nhanh</span> <label class="switch"><input type="checkbox" id="fastRenameToggle" aria-label="Bật đổi tên nhanh"><span class="slider"></span></label></div>
        <button class="close-modal" id="saveLabelsBtn" style="color: #00bcd4;">Lưu cấu hình</button>
        <button class="close-modal" id="closeLabelsBtn" style="color: #ff3b30;">Huỷ</button>
    </div>
</div>

<div class="modal-overlay" id="effectModal" role="dialog" aria-modal="true">
    <div class="modal-content">
        <h3>Hiệu ứng Icon</h3>
        <div style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; background: var(--color-input-bg); padding: 12px; border-radius: 14px;">
            <span style="font-weight: 600;">Viền VisionOS</span> <label class="switch" style="margin: 0;"><input type="checkbox" id="strokeToggle" aria-label="Bật viền"><span class="slider"></span></label>
        </div>
        <div style="margin-bottom: 16px;"><label style="display:block; margin-bottom:6px;" for="markStyle">Kiểu Mark</label><select id="markStyle" style="width:100%; padding:10px; border-radius:12px; border:none; background:var(--color-input-bg);"><option value="0">Liquid Glass</option><option value="1">Crystal Shine</option><option value="2">Holographic</option><option value="3">Matte Dark</option><option value="4">Classic Glossy</option></select></div>
        <div style="margin-bottom: 16px;">
            <label style="display:block; margin-bottom:6px;">Hướng đổ bóng</label>
            <div style="display: flex; gap: 8px;">
                <button class="dir-btn" data-dir="left" aria-label="Bóng trái" style="flex:1; padding:8px; border-radius:8px; border:none; background:var(--color-input-bg);">◀︎</button>
                <button class="dir-btn" data-dir="right" aria-label="Bóng phải" style="flex:1; padding:8px; border-radius:8px; border:none; background:var(--color-input-bg);">►</button>
                <button class="dir-btn" data-dir="center" aria-label="Bóng giữa" style="flex:1; padding:8px; border-radius:8px; border:none; background:var(--color-input-bg);">❖</button>
                <button class="dir-btn" data-dir="top" aria-label="Bóng trên" style="flex:1; padding:8px; border-radius:8px; border:none; background:var(--color-input-bg);">▲</button>
                <button class="dir-btn" data-dir="bottom" aria-label="Bóng dưới" style="flex:1; padding:8px; border-radius:8px; border:none; background:var(--color-input-bg);">▼</button>
            </div>
        </div>
        <div style="margin-bottom: 16px;"><label style="display:block; margin-bottom:6px;" for="shadowBlurInput">Blur</label><input type="number" id="shadowBlurInput" style="width:100%; padding:10px; border-radius:12px; border:none; background:var(--color-input-bg); text-align:center;" value="10"></div>
        <div style="margin-bottom: 16px;"><label style="display:block; margin-bottom:6px;" for="shadowOffsetInput">Offset</label><input type="number" id="shadowOffsetInput" style="width:100%; padding:10px; border-radius:12px; border:none; background:var(--color-input-bg); text-align:center;" value="10"></div>
        <div style="margin-bottom: 16px;"><label style="display:block; margin-bottom:6px;" for="shadowOpacityInput">Opacity</label><input type="number" id="shadowOpacityInput" style="width:100%; padding:10px; border-radius:12px; border:none; background:var(--color-input-bg); text-align:center;" value="30"></div>
        <div style="margin-bottom: 16px;"><label style="display:block; margin-bottom:6px;" for="radiusStyle">Bo góc Icon</label><select id="radiusStyle" style="width:100%; padding:10px; border-radius:12px; border:none; background:var(--color-input-bg);"><option value="0">Squircle (Apple)</option><option value="1">Tròn hoàn toàn</option><option value="2">Vuông nhẹ</option></select></div>
        <button class="close-modal" id="saveEffectBtn" style="color: #00bcd4;">Lưu hiệu ứng</button>
        <button class="close-modal" id="closeEffectBtn" style="color: #ff3b30;">Huỷ</button>
    </div>
</div>

<div class="modal-overlay" id="dockModal" role="dialog" aria-modal="true">
    <div class="modal-content">
        <h3>Dock</h3>
        <div style="margin-bottom: 10px;"><label class="switch"><input type="radio" name="dockSel" id="dockGlassToggle" aria-label="Dock kính"><span class="slider"></span></label><span>Kính trong suốt</span></div>
        <div style="margin-bottom: 10px;"><label class="switch"><input type="radio" name="dockSel" id="dockWoodToggle" aria-label="Dock gỗ"><span class="slider"></span></label><span>Gỗ (iOS 6)</span></div>
        <div style="margin-bottom: 10px;"><label class="switch"><input type="radio" name="dockSel" id="dockBlurToggle" aria-label="Dock mờ đen"><span class="slider"></span></label><span>Mờ Đen</span></div>
        <div style="margin-bottom: 10px;"><label class="switch"><input type="radio" name="dockSel" id="dockNoneToggle" checked aria-label="Tắt dock"><span class="slider"></span></label><span>Tắt Dock</span></div>
        <button class="close-modal" id="saveDockBtn" style="color: #00bcd4;">Lưu cấu hình</button>
        <button class="close-modal" id="closeDockBtn" style="color: #ff3b30;">Huỷ</button>
    </div>
</div>

<div class="modal-overlay" id="addAppModal" role="dialog" aria-modal="true">
    <div class="modal-content">
        <h3>➕ Thêm ứng dụng</h3>
        <div class="modal-list" id="modalList" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; margin-top:10px;"></div>
        <button class="close-modal" id="closeModalBtn">Đóng</button>
    </div>
</div>

<script src="./script.js"></script>
<script>
    // Đăng ký Service Worker ngay khi trang load
    if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
            navigator.serviceWorker.register('./sw.js').then(function(registration) {
                console.log('ServiceWorker registration successful with scope: ', registration.scope);
            }, function(err) {
                console.log('ServiceWorker registration failed: ', err);
            });
        });
    }
</script>
</body>
</html>
