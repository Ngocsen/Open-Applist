<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Snowboard" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Snowboard V6.7 - Online iTunes App Search</title>
</head>
<body>

<div id="toast">Thông báo</div>

<div class="app-container">
    <div class="app-grid" id="appGrid"></div>
</div>

<button id="settingsBtn" aria-label="Cài đặt">
    <img src="icons/icon_setting.png" onerror="this.outerHTML='⚙️'" />
</button>

<div id="dockArea" class="dock-container" style="display:none;"></div>

<div id="drawerWrapper">
    <div id="drawerContent">
        <button class="drawer-btn" id="btnInfo"><img src="icons/icon_info.png" onerror="this.outerHTML='ℹ️'" /></button>
        <button class="drawer-btn" id="btnReset"><img src="icons/icon_reset.png" onerror="this.outerHTML='🔄'" /></button>
        <button class="drawer-btn" id="btnPlugin"><img src="icons/icon_plugin.png" onerror="this.outerHTML='🔌'" /></button>
        <button class="drawer-btn" id="btnDelete"><img src="icons/icon_delete.png" onerror="this.outerHTML='🗑️'" /></button>
        <button class="drawer-btn" id="btnSettings"><img src="icons/icon_setting.png" onerror="this.outerHTML='⚙️'" /></button>
        <button id="drawerClose">✕</button>
    </div>
</div>

<!-- POPUP INFO -->
<div class="modal-overlay" id="infoModal">
    <div class="modal-content">
        <h3 id="infoTitle" style="color: #0071e3; font-size: 20px; margin-bottom: 16px;">Sentechtipsvn</h3>
        <div style="background: rgba(255,255,255,0.15); backdrop-filter: blur(20px); border-radius: 18px; padding: 12px; display: flex; flex-direction: column; gap: 10px; border: 1px solid rgba(255,255,255,0.2);">
            <button class="close-modal" id="btnMail" style="margin-top: 0; background: transparent; border: none; color: inherit;"></button>
            <button class="close-modal" id="btnFollow" style="margin-top: 0; background: transparent; border: none; color: inherit;"></button>
            <button class="close-modal" id="btnInfoDetails" style="margin-top: 0; background: transparent; border: none; color: inherit;"></button>
        </div>
        <button class="close-modal lang-close" id="closeInfoModal" style="margin-top: 16px;"></button>
    </div>
</div>

<!-- POPUP MAIN SETTINGS -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
        <h3 id="txtSettingTitle"></h3>
        <button class="close-modal" id="openEffectsBtn"></button>
        <button class="close-modal" id="openDockBtn"></button>
        <button class="close-modal" id="openLabelsBtn"></button>
        <div style="display: flex; gap: 10px; margin-top: 16px;">
            <button class="close-modal" id="exportBtn" style="margin-top: 0; background: rgba(0, 188, 212, 0.2); color: #00bcd4;"></button>
            <button class="close-modal" id="importBtn" style="margin-top: 0; background: rgba(52, 199, 89, 0.2); color: #34c759;"></button>
        </div>
        <button class="close-modal lang-close" id="closeSettingsBtn"></button>
    </div>
</div>

<!-- POPUP LABELS / MANAGE APPS -->
<div class="modal-overlay" id="labelsModal">
    <div class="modal-content">
        <h3 id="lblLabelsTitle"></h3>
        <div style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;"><span id="txtHideLabels"></span> <label class="switch"><input type="radio" name="labelToggle" id="hideLabelsToggle"><span class="slider"></span></label></div>
        <div style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center;"><span id="txtShowLabels"></span> <label class="switch"><input type="radio" name="labelToggle" id="showLabelsToggle" checked><span class="slider"></span></label></div>
        <div style="margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(150,150,150,0.2); padding-top: 10px;"><span id="txtFastRename"></span> <label class="switch"><input type="checkbox" id="fastRenameToggle"><span class="slider"></span></label></div>
        <button class="close-modal" id="saveLabelsBtn" style="color: #00bcd4;"></button>
        <button class="close-modal lang-cancel" id="closeLabelsBtn" style="color: #ff3b30;"></button>
    </div>
</div>

<!-- POPUP HIỆU ỨNG ICON -->
<div class="modal-overlay" id="effectModal">
    <div class="modal-content">
        <h3 id="txtEffectTitle" style="color: #20b2aa;"></h3>
        <div style="margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center; background: var(--color-input-bg); padding: 12px; border-radius: 14px;">
            <span style="font-weight: 600; color: #1e1e2f;" id="txtVisionStroke"></span> <label class="switch" style="margin: 0;"><input type="checkbox" id="strokeToggle"><span class="slider"></span></label>
        </div>
        <div style="margin-bottom: 16px;">
            <label id="lblMarkStyle"></label>
            <select id="markStyle" class="input-num">
                <option value="0">Liquid Glass</option>
                <option value="1">Crystal Shine</option>
                <option value="2">Holographic</option>
                <option value="3">Matte Dark</option>
                <option value="4">Classic Glossy</option>
            </select>
        </div>
        <div style="margin-bottom: 16px;">
            <label id="lblShadowDirection"></label>
            <div class="direction-container">
                <button class="dir-btn" data-dir="left">◀︎</button>
                <button class="dir-btn" data-dir="right">►</button>
                <button class="dir-btn" data-dir="center">❖</button>
                <button class="dir-btn" data-dir="top">▲</button>
                <button class="dir-btn" data-dir="bottom">▼</button>
            </div>
        </div>
        <div style="margin-bottom: 16px;">
            <label id="lblShadowBlur"></label>
            <input type="number" id="shadowBlurInput" class="input-num" style="text-align:center;" value="10">
        </div>
        <div style="margin-bottom: 16px;">
            <label id="lblShadowOffset"></label>
            <input type="number" id="shadowOffsetInput" class="input-num" style="text-align:center;" value="10">
        </div>
        <div style="margin-bottom: 16px;">
            <label id="lblShadowOpacity"></label>
            <input type="number" id="shadowOpacityInput" class="input-num" style="text-align:center;" value="30">
        </div>
        <div style="margin-bottom: 16px;">
            <label id="lblRadiusStyle"></label>
            <select id="radiusStyle" class="input-num">
                <option value="0">Squircle (Chuẩn Apple)</option>
                <option value="1">Tròn hoàn toàn</option>
                <option value="2">Vuông nhẹ</option>
            </select>
        </div>
        <button class="close-modal" id="saveEffectBtn" style="color: #00bcd4;"></button>
        <button class="close-modal lang-cancel" id="closeEffectBtn" style="color: #ff3b30;"></button>
    </div>
</div>

<!-- POPUP DOCK -->
<div class="modal-overlay" id="dockModal">
    <div class="modal-content">
        <h3 id="txtDockTitle"></h3>
        <div style="margin-bottom: 16px; display: flex; align-items: center;"><label class="switch" style="margin-right: 12px;"><input type="radio" name="dockSel" id="dockGlassToggle"><span class="slider"></span></label><span id="txtDockGlass"></span></div>
        <div style="margin-bottom: 16px; display: flex; align-items: center;"><label class="switch" style="margin-right: 12px;"><input type="radio" name="dockSel" id="dockWoodToggle"><span class="slider"></span></label><span id="txtDockWood"></span></div>
        <div style="margin-bottom: 16px; display: flex; align-items: center;"><label class="switch" style="margin-right: 12px;"><input type="radio" name="dockSel" id="dockBlurToggle"><span class="slider"></span></label><span id="txtDockBlur"></span></div>
        <div style="margin-bottom: 24px; display: flex; align-items: center;"><label class="switch" style="margin-right: 12px;"><input type="radio" name="dockSel" id="dockNoneToggle" checked><span class="slider"></span></label><span id="txtDockDisable"></span></div>
        <button class="close-modal" id="saveDockBtn" style="color: #00bcd4; margin-top: 8px;"></button>
        <button class="close-modal lang-cancel" id="closeDockBtn" style="color: #ff3b30; margin-top: 10px;"></button>
    </div>
</div>

<!-- POPUP THÊM APP ONLINE TỰ ĐỘNG -->
<div class="modal-overlay" id="addAppModal">
    <div class="modal-content">
        <h3 id="txtAddAppTitle"></h3>
        
        <!-- Ô TÌM KIẾM APP ONLINE TRỰC TIẾP -->
        <div style="margin-top: 10px; margin-bottom: 12px;">
            <input type="text" id="appSearchInput" class="search-box" placeholder="🔍 Tìm kiếm trên App Store..." />
        </div>

        <div class="modal-list" id="modalList" style="display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px 8px; max-height: 45vh; overflow-y: auto;"></div>
        <button class="close-modal lang-close" id="closeModalBtn"></button>
    </div>
</div>

<script>
    const FALLBACK_DB = { "vn.com.vng.zingalo": {"Name":"Zalo","icon":"https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/a6/fd/de/a6fdde29-8d09-cd61-d8e9-bd5293b9cf21/AppIcon-0-0-1x_U007emarketing-0-8-0-85-220.png/100x100bb.png"} };
    let appDatabase = {}, socialData = { links: { email: '', social_follow: '', plugin_shortcut: '' } }, langData = {};
    const basePath = '.';
    
    const ST_KEYS = { app: 'myAppList', name: 'myAppNames', dock: 'myDockApps', mark: 'effectMarkStyle', radius: 'effectRadiusStyle', dir: 'effectShadowDirection', blur: 'effectShadowBlur', offset: 'effectShadowOffset', opacity: 'effectShadowOpacity', dockStyle: 'dockStyle', stroke: 'effectStroke', hideLab: 'hideLabels' };
    const MAX_APPS = 12, MAX_DOCK_APPS = 3;
    let isDeleteMode = false, isAddingDock = false, isFastRenameMode = false;
    let searchTimeout = null;

    const grid = document.getElementById('appGrid'), dockArea = document.getElementById('dockArea'), drawerWrapper = document.getElementById('drawerWrapper');
    const DEFAULT_APPS = ['com.deepseek.chat', 'vn.com.vng.zingalo', 'com.facebook.Facebook', 'com.apple.mobilesafari'];

    Promise.all([
        fetch(basePath + '/db.json').then(res => res.json()).catch(() => FALLBACK_DB),
        fetch(basePath + '/system-app.json').then(res => res.json()).catch(() => ({})),
        fetch(basePath + '/social.json').then(res => res.json()).catch(() => socialData),
        fetch(basePath + '/Language/vi_VN.json').then(res => res.json()).catch(() => ({}))
    ]).then(([db, sysApp, social, lang]) => {
        appDatabase = { ...db, ...sysApp }; 
        socialData = social || socialData;
        langData = lang || {};
        applyLanguage();
        initUI();
    });

    function applyLanguage() {
        if (!langData.effects) return;
        
        document.getElementById('infoTitle').innerText = langData.info_popup?.title || 'Sentechtipsvn';
        document.getElementById('btnMail').innerText = langData.info_popup?.contact || 'Liên hệ';
        document.getElementById('btnFollow').innerText = langData.info_popup?.follow || 'Theo dõi kênh';
        document.getElementById('btnInfoDetails').innerText = langData.info_popup?.info || 'Thông tin';

        document.getElementById('txtSettingTitle').innerText = langData.effects.settings?.title || 'Cài đặt';
        document.getElementById('openEffectsBtn').innerText = langData.effects.settings?.effects_menu || 'Icons Effects';
        document.getElementById('openDockBtn').innerText = langData.effects.settings?.dock_menu || 'Dock';
        document.getElementById('openLabelsBtn').innerText = langData.app_menu?.manage_apps || 'Quản lý Ứng dụng';
        document.getElementById('exportBtn').innerText = langData.common?.export_config || '📤 Xuất Cấu Hình';
        document.getElementById('importBtn').innerText = langData.common?.import_config || '📥 Nhập';

        document.getElementById('lblLabelsTitle').innerText = langData.app_menu?.manage_apps || 'Quản lý Ứng dụng';
        document.getElementById('txtHideLabels').innerText = langData.common?.hide_app_name || 'Ẩn tên ứng dụng';
        document.getElementById('txtShowLabels').innerText = langData.common?.show_app_name || 'Hiện tên ứng dụng';
        document.getElementById('txtFastRename').innerText = langData.common?.fast_rename_mode || 'Chế độ Đổi tên nhanh';
        document.getElementById('saveLabelsBtn').innerText = langData.button?.save_config || 'Lưu cấu hình';

        document.getElementById('txtEffectTitle').innerText = langData.effects?.title || 'Hiệu ứng Icon';
        document.getElementById('txtVisionStroke').innerText = langData.effects?.vision_stroke || 'Viền VisionOS';
        document.getElementById('lblMarkStyle').innerText = langData.effects?.mark_label || 'Kiểu Mark';
        document.getElementById('lblShadowDirection').innerText = langData.effects?.shadow_direction_label || 'Hướng đổ bóng:';
        document.getElementById('lblShadowBlur').innerText = langData.effects?.shadow_blur_label || 'Blur:';
        document.getElementById('lblShadowOffset').innerText = langData.effects?.shadow_offset_label || 'Offset:';
        document.getElementById('lblShadowOpacity').innerText = langData.effects?.shadow_opacity_label || 'Opacity:';
        document.getElementById('lblRadiusStyle').innerText = langData.effects?.radius_label || 'Kiểu Bo góc Icon';
        document.getElementById('saveEffectBtn').innerText = langData.effects?.save || 'Lưu hiệu ứng';

        document.getElementById('txtDockTitle').innerText = langData.effects.dock?.title || 'Dock';
        document.getElementById('txtDockGlass').innerText = langData.effects.dock?.glass || 'Kính trong suốt';
        document.getElementById('txtDockWood').innerText = langData.effects.dock?.wood || 'Gỗ (iOS 6)';
        document.getElementById('txtDockBlur').innerText = langData.effects.dock?.blur || 'Mờ Đen';
        document.getElementById('txtDockDisable').innerText = langData.effects.dock?.disable || 'Tắt Dock';
        document.getElementById('saveDockBtn').innerText = langData.effects.dock?.save || 'Lưu cấu hình';

        document.querySelectorAll('.lang-close').forEach(el => el.innerText = langData.button?.close || 'Đóng');
        document.querySelectorAll('.lang-cancel').forEach(el => el.innerText = langData.button?.cancel || 'Huỷ');
        document.getElementById('txtAddAppTitle').innerText = '➕ ' + (langData.modal?.title_add_app || 'Thêm ứng dụng');
        
        if (document.getElementById('appSearchInput')) {
            document.getElementById('appSearchInput').placeholder = langData.modal?.search_placeholder || '🔍 Tìm kiếm trên App Store...';
        }
    }

    function cleanIconPath(iconPath) {
        if (!iconPath) return '';
        return iconPath.includes('\\/') ? iconPath.replace(/\\\//g, '/') : iconPath;
    }

    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
    
    function closeDrawerSecure() { 
        drawerWrapper.classList.remove('open'); 
        setTimeout(() => drawerWrapper.style.display = 'none', 250);
        if (document.body.classList.contains('dock-active')) {
            const dockSetBtn = document.getElementById('dockSetInner');
            if(dockSetBtn) dockSetBtn.innerHTML = `<img src="icons/icon_setting.png" onerror="this.outerHTML='⚙️'" style="width:100%; height:100%; object-fit:contain;">`;
        } else if (!isDeleteMode) {
            document.getElementById('settingsBtn').style.display = 'flex';
        }
    }
    
    function getVals(key, def) { try { return JSON.parse(localStorage.getItem(key)) || def; } catch(e) { return def; } }
    function setVals(key, val) { localStorage.setItem(key, JSON.stringify(val)); }

    function createAppItem(id, data, isDockItem = false) {
        const div = document.createElement('div'); div.className = 'app-item'; div.dataset.id = id; div.dataset.zone = isDockItem ? 'dock' : 'grid';
        let dName = getVals(ST_KEYS.name, {})[id] || data.Name;
        let cleanIcon = cleanIconPath(data.icon);
        let iconSrc = cleanIcon && !cleanIcon.startsWith('http') && !cleanIcon.startsWith('/') ? basePath + '/' + cleanIcon : cleanIcon;
        
        const mark = localStorage.getItem(ST_KEYS.mark) || '0', sDir = localStorage.getItem(ST_KEYS.dir) || 'bottom', radius = localStorage.getItem(ST_KEYS.radius) || '0';
        const sBlur = localStorage.getItem(ST_KEYS.blur) || '10', sOff = localStorage.getItem(ST_KEYS.offset) || '10', sOp = (localStorage.getItem(ST_KEYS.opacity) || '30') / 100;
        const stroke = localStorage.getItem(ST_KEYS.stroke) === 'true';

        let radCSS = radius === '1' ? '50%' : radius === '2' ? '12px' : '16px';
        let ox = sDir==='left'? -sOff : sDir==='right'? sOff : 0;
        let oy = sDir==='top'? -sOff : sDir==='bottom'? sOff : 0;

        div.innerHTML = `
            <div class="icon-wrapper ${stroke ? 'vision-stroke' : ''}" style="border-radius:${radCSS}; box-shadow:${ox}px ${oy}px ${sBlur}px rgba(0,0,0,${sOp}); width:60px; height:60px;">
                <img class="icon-img" style="border-radius:${radCSS};" src="${iconSrc}" onerror="this.style.display='none'">
                <span class="fallback-text"></span>
                <div class="mark-overlay" style="border-radius:${radCSS}; background:${mark==='0'?'linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.02))':mark==='1'?'linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.3) 100%)':'rgba(0,0,0,0.1)'}"></div>
                ${isDeleteMode ? '<div class="delete-icon">✕</div>' : ''}
            </div>
            ${!isDockItem ? `<div class="app-info"><span class="app-name">${dName}</span></div>` : ''}
        `;

        if(isDeleteMode) {
            div.querySelector('.delete-icon').onclick = (e) => { e.stopPropagation(); deleteApp(id); };
        } else {
            div.onclick = () => isFastRenameMode ? renameApp(id, dName) : window.location.href = "shortcuts://run-shortcut?name=Open App Launcher&input=text&text=" + encodeURIComponent(id);
        }
        return div;
    }

    function renderDock() {
        const style = localStorage.getItem(ST_KEYS.dockStyle) || 'none';
        dockArea.innerHTML = '';
        if (style === 'none') {
            document.body.classList.remove('dock-active'); dockArea.style.display = 'none'; closeDrawerSecure(); return;
        }
        document.body.classList.add('dock-active'); dockArea.style.display = 'flex'; document.getElementById('settingsBtn').style.display = 'none';
        dockArea.className = 'dock-container dock-style-' + style;
        
        const main = getVals(ST_KEYS.app, DEFAULT_APPS);
        const dApps = getVals(ST_KEYS.dock, []).filter(id => !main.includes(id)).slice(0, MAX_DOCK_APPS);
        dApps.forEach(id => { if(appDatabase[id]) dockArea.appendChild(createAppItem(id, appDatabase[id], true)); });

        if (dApps.length < MAX_DOCK_APPS) {
            const addBtn = document.createElement('div'); addBtn.className = 'app-item';
            addBtn.innerHTML = `<div class="icon-wrapper" style="width:60px; height:60px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.2); border-radius:16px;"><span style="font-size:28px; color:#fff;">+</span></div>`;
            addBtn.onclick = () => { isAddingDock = true; renderModal(); };
            dockArea.appendChild(addBtn);
        }

        const setBtn = document.createElement('div'); setBtn.className = 'app-item'; setBtn.dataset.id = 'sys_settings';
        
        const mark = localStorage.getItem(ST_KEYS.mark) || '0', sDir = localStorage.getItem(ST_KEYS.dir) || 'bottom', radius = localStorage.getItem(ST_KEYS.radius) || '0';
        const sBlur = localStorage.getItem(ST_KEYS.blur) || '10', sOff = localStorage.getItem(ST_KEYS.offset) || '10', sOp = (localStorage.getItem(ST_KEYS.opacity) || '30') / 100;
        const stroke = localStorage.getItem(ST_KEYS.stroke) === 'true';
        let radCSS = radius === '1' ? '50%' : radius === '2' ? '12px' : '16px';
        let ox = sDir==='left'? -sOff : sDir==='right'? sOff : 0;
        let oy = sDir==='top'? -sOff : sDir==='bottom'? sOff : 0;

        setBtn.innerHTML = `
            <div class="icon-wrapper ${stroke ? 'vision-stroke' : ''}" style="border-radius:${radCSS}; box-shadow:${ox}px ${oy}px ${sBlur}px rgba(0,0,0,${sOp}); width:60px; height:60px; background:transparent;" id="dockSetInner">
                ${isDeleteMode ? '<span style="font-size:24px; color:#34c759; display:flex; align-items:center; justify-content:center; width:100%; height:100%;">✅</span>' : '<img src="icons/icon_setting.png" onerror="this.outerHTML=\'⚙️\'" style="width:100%; height:100%; object-fit:contain;">'}
            </div>
        `;
        setBtn.onclick = () => {
            if(isDeleteMode) { toggleDeleteMode(); return; }
            if(drawerWrapper.classList.contains('open')) closeDrawerSecure();
            else {
                const rect = setBtn.getBoundingClientRect();
                drawerWrapper.style.display = 'flex';
                drawerWrapper.style.bottom = 'calc(90px + env(safe-area-inset-bottom, 20px))';
                drawerWrapper.style.left = (rect.left + rect.width / 2) + 'px';
                drawerWrapper.style.right = 'auto';
                drawerWrapper.style.transform = 'translateX(-50%)';
                void drawerWrapper.offsetWidth; 
                drawerWrapper.classList.add('open');
                document.getElementById('dockSetInner').innerHTML = '<span style="font-size:24px; color:#fff; display:flex; align-items:center; justify-content:center; width:100%; height:100%;">✕</span>';
            }
        };
        dockArea.appendChild(setBtn);
    }

    function renderGrid() {
        grid.innerHTML = '';
        document.body.classList.toggle('hide-labels', localStorage.getItem(ST_KEYS.hideLab) === 'true');
        getVals(ST_KEYS.app, DEFAULT_APPS).slice(0, MAX_APPS).forEach(id => { if(appDatabase[id]) grid.appendChild(createAppItem(id, appDatabase[id])); });
        
        if (getVals(ST_KEYS.app, []).length < MAX_APPS) {
            const addBtn = document.createElement('div'); addBtn.className = 'app-item';
            addBtn.innerHTML = `<div class="icon-wrapper" style="width:60px; height:60px; display:flex; align-items:center; justify-content:center; border:2px dashed rgba(255,255,255,0.6); border-radius:16px;"><span style="font-size:28px; color:#4f46e5;">+</span></div><div class="app-info"><span class="app-name">${langData.button?.add || 'Thêm'}</span></div>`;
            addBtn.onclick = () => { isAddingDock = false; renderModal(); };
            grid.appendChild(addBtn);
        }
        renderDock();
    }

    function toggleDeleteMode() {
        isDeleteMode = !isDeleteMode; renderGrid();
        document.getElementById('btnDelete').innerHTML = isDeleteMode ? '<span style="font-size:18px; color:#34c759;">✅</span>' : '<img src="icons/icon_delete.png" onerror="this.outerHTML=\'🗑️\'" />';
    }

    /* HÀM TÌM KIẾM APP ONLINE QUA ITUNES SEARCH API */
    function searchOnlineApps(query) {
        const ml = document.getElementById('modalList');
        if (!query.trim()) { renderModalList(); return; }

        ml.innerHTML = '<div style="grid-column: span 4; text-align: center; color: #666; font-size: 13px; padding: 10px;">🔍 Đang tìm kiếm trên Store...</div>';

        fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&country=vn&entity=software&limit=12`)
            .then(res => res.json())
            .then(data => {
                ml.innerHTML = '';
                if (!data.results || data.results.length === 0) {
                    ml.innerHTML = '<div style="grid-column: span 4; text-align: center; color: #888; font-size: 13px;">Không tìm thấy ứng dụng!</div>';
                    return;
                }
                data.results.forEach(app => {
                    const bundleId = app.bundleId;
                    const appName = app.trackName;
                    const iconUrl = app.artworkUrl512 || app.artworkUrl100;

                    // Lưu tạm vào database để dùng ngay
                    appDatabase[bundleId] = { Name: appName, icon: iconUrl };

                    const item = document.createElement('div'); item.className = 'app-item';
                    item.innerHTML = `<div class="icon-wrapper" style="width:50px; height:50px; border-radius:12px;"><img src="${iconUrl}" class="icon-img"></div><span style="font-size:10px; margin-top:4px; text-align:center; width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${appName}</span>`;
                    item.onclick = () => selectAppToAdd(bundleId);
                    ml.appendChild(item);
                });
            })
            .catch(() => {
                ml.innerHTML = '<div style="grid-column: span 4; text-align: center; color: #ff3b30; font-size: 13px;">Lỗi kết nối mạng!</div>';
            });
    }

    function selectAppToAdd(id) {
        let arr = getVals(isAddingDock ? ST_KEYS.dock : ST_KEYS.app, []);
        let maxLimitMsg = (langData.modal?.max_apps_limit || "Bạn chỉ có thể thêm tối đa {max} ứng dụng.").replace('{max}', isAddingDock ? MAX_DOCK_APPS : MAX_APPS);
        if(arr.length >= (isAddingDock ? MAX_DOCK_APPS : MAX_APPS)) return showToast(maxLimitMsg);
        
        arr.push(id); 
        setVals(isAddingDock ? ST_KEYS.dock : ST_KEYS.app, arr);
        document.getElementById('addAppModal').classList.remove('active'); 
        isAddingDock = false; 
        renderGrid();
    }

    function renderModalList() {
        const ml = document.getElementById('modalList'); ml.innerHTML = '';
        const used = [...getVals(ST_KEYS.app, []), ...getVals(ST_KEYS.dock, [])];
        Object.keys(appDatabase).filter(id => !used.includes(id)).forEach(id => {
            const item = document.createElement('div'); item.className = 'app-item';
            let cleanIcon = cleanIconPath(appDatabase[id].icon);
            item.innerHTML = `<div class="icon-wrapper" style="width:50px; height:50px; border-radius:12px;"><img src="${cleanIcon}" class="icon-img" onerror="this.style.display='none'"></div><span style="font-size:10px; margin-top:4px;">${appDatabase[id].Name}</span>`;
            item.onclick = () => selectAppToAdd(id);
            ml.appendChild(item);
        });
    }

    function renderModal() {
        document.getElementById('appSearchInput').value = '';
        renderModalList();
        document.getElementById('addAppModal').classList.add('active');
    }

    function renameApp(id, old) {
        let msg = langData.messages?.prompt_rename_app || 'Nhập tên mới cho ứng dụng:';
        let n = prompt(msg, old);
        if(n !== null) { let dict = getVals(ST_KEYS.name, {}); n.trim() ? dict[id] = n.trim() : delete dict[id]; setVals(ST_KEYS.name, dict); renderGrid(); }
    }

    function openSettings(modalId) { closeDrawerSecure(); document.getElementById(modalId).classList.add('active'); }

    function initUI() {
        document.getElementById('settingsBtn').onclick = () => {
            document.getElementById('settingsBtn').style.display='none';
            drawerWrapper.style.display='flex';
            drawerWrapper.style.bottom = 'calc(30px + env(safe-area-inset-bottom, 20px))';
            drawerWrapper.style.left = 'auto';
            drawerWrapper.style.right = '20px';
            drawerWrapper.style.transform = 'none';
            void drawerWrapper.offsetWidth; 
            drawerWrapper.classList.add('open');
        };
        document.getElementById('drawerClose').onclick = closeDrawerSecure;

        document.getElementById('appSearchInput').oninput = (e) => {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => searchOnlineApps(e.target.value), 400);
        };

        document.getElementById('btnDelete').onclick = toggleDeleteMode;
        document.getElementById('btnReset').onclick = () => { 
            let resetMsg = langData.messages?.reset_confirm || "Xoá sạch danh sách app hiện tại và trở về mặc định?";
            if(confirm(resetMsg)){ localStorage.clear(); location.reload(); }
        };
        
        document.getElementById('btnInfo').onclick = () => { 
            closeDrawerSecure(); 
            document.getElementById('infoModal').classList.add('active');
        };
        
        document.getElementById('btnMail').onclick = () => window.open(socialData.links?.email || 'mailto:sentechtips@gmail.com', '_blank');
        document.getElementById('btnFollow').onclick = () => window.open(socialData.links?.social_follow || 'https://icloud.com', '_blank');
        document.getElementById('btnInfoDetails').onclick = () => { 
            const infoText = langData.dock_info?.app_version || "• Tên : Snowboard\n• Tác giả : Sentechtipsvn 🇻🇳";
            alert(infoText); 
        };
        document.getElementById('closeInfoModal').onclick = () => document.getElementById('infoModal').classList.remove('active');

        document.getElementById('btnPlugin').onclick = () => { closeDrawerSecure(); window.open(socialData.links?.plugin_shortcut || 'https://www.icloud.com/shortcuts', '_blank'); };
        document.getElementById('btnSettings').onclick = () => openSettings('settingsModal');

        document.getElementById('openEffectsBtn').onclick = () => { document.getElementById('settingsModal').classList.remove('active'); openSettings('effectModal'); };
        document.getElementById('openDockBtn').onclick = () => { document.getElementById('settingsModal').classList.remove('active'); openSettings('dockModal'); };
        document.getElementById('openLabelsBtn').onclick = () => { document.getElementById('settingsModal').classList.remove('active'); openSettings('labelsModal'); };
        
        document.querySelectorAll('.dir-btn').forEach(btn => btn.onclick = () => { document.querySelectorAll('.dir-btn').forEach(b => b.style.border='none'); btn.style.border='2px solid #0071e3'; btn.classList.add('active'); });

        document.getElementById('saveEffectBtn').onclick = () => {
            localStorage.setItem(ST_KEYS.mark, document.getElementById('markStyle').value);
            localStorage.setItem(ST_KEYS.radius, document.getElementById('radiusStyle').value);
            localStorage.setItem(ST_KEYS.stroke, document.getElementById('strokeToggle').checked);
            let activeDir = document.querySelector('.dir-btn.active');
            if(activeDir) localStorage.setItem(ST_KEYS.dir, activeDir.dataset.dir);
            localStorage.setItem(ST_KEYS.blur, document.getElementById('shadowBlurInput').value);
            localStorage.setItem(ST_KEYS.offset, document.getElementById('shadowOffsetInput').value);
            localStorage.setItem(ST_KEYS.opacity, document.getElementById('shadowOpacityInput').value);
            document.getElementById('effectModal').classList.remove('active'); renderGrid(); showToast("OK");
        };

        document.getElementById('saveDockBtn').onclick = () => {
            let style = 'none';
            if(document.getElementById('dockGlassToggle').checked) style = 'glass';
            else if(document.getElementById('dockWoodToggle').checked) style = 'wood';
            else if(document.getElementById('dockBlurToggle').checked) style = 'blur';
            localStorage.setItem(ST_KEYS.dockStyle, style);
            document.getElementById('dockModal').classList.remove('active'); renderGrid(); showToast("OK");
        };

        document.getElementById('saveLabelsBtn').onclick = () => {
            localStorage.setItem(ST_KEYS.hideLab, document.getElementById('hideLabelsToggle').checked);
            isFastRenameMode = document.getElementById('fastRenameToggle').checked; 
            document.getElementById('labelsModal').classList.remove('active'); renderGrid(); showToast("OK");
        };

        document.querySelectorAll('.close-modal').forEach(btn => { 
            if(btn.id.includes('close') || btn.id.includes('Close')) {
                btn.onclick = (e) => e.target.closest('.modal-overlay').classList.remove('active');
            }
        });

        document.getElementById('exportBtn').onclick = () => {
            const data = { apps: getVals(ST_KEYS.app,[]), dock: getVals(ST_KEYS.dock,[]), names: getVals(ST_KEYS.name,{}), eff: { mark: localStorage.getItem(ST_KEYS.mark), rad: localStorage.getItem(ST_KEYS.radius), dir: localStorage.getItem(ST_KEYS.dir), blur: localStorage.getItem(ST_KEYS.blur), off: localStorage.getItem(ST_KEYS.offset), op: localStorage.getItem(ST_KEYS.opacity), dk: localStorage.getItem(ST_KEYS.dockStyle), st: localStorage.getItem(ST_KEYS.stroke), hl: localStorage.getItem(ST_KEYS.hideLab) }};
            navigator.clipboard.writeText(btoa(encodeURIComponent(JSON.stringify(data)))).then(() => { document.getElementById('settingsModal').classList.remove('active'); showToast("Copied"); });
        };
        document.getElementById('importBtn').onclick = () => {
            let code = prompt("Config code:"); if(!code) return;
            try {
                let d = JSON.parse(decodeURIComponent(atob(code)));
                if(d.apps) setVals(ST_KEYS.app, d.apps); if(d.dock) setVals(ST_KEYS.dock, d.dock); if(d.names) setVals(ST_KEYS.name, d.names);
                if(d.eff) { localStorage.setItem(ST_KEYS.mark, d.eff.mark||'0'); localStorage.setItem(ST_KEYS.radius, d.eff.rad||'0'); localStorage.setItem(ST_KEYS.dir, d.eff.dir||'bottom'); localStorage.setItem(ST_KEYS.blur, d.eff.blur||'10'); localStorage.setItem(ST_KEYS.offset, d.eff.off||'10'); localStorage.setItem(ST_KEYS.opacity, d.eff.op||'30'); localStorage.setItem(ST_KEYS.dockStyle, d.eff.dk||'none'); localStorage.setItem(ST_KEYS.stroke, d.eff.st||'false'); localStorage.setItem(ST_KEYS.hideLab, d.eff.hl||'false'); }
                document.getElementById('settingsModal').classList.remove('active'); showToast("Success!"); setTimeout(() => location.reload(), 1000);
            } catch(e) { alert("Error!"); }
        };

        renderGrid();
    }
</script>
</body>
</html>
