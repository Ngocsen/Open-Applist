<div class="modal-overlay" id="effectModal"><div class="modal-content"><h3 id="txtEffectTitle" style="color: #20b2aa;">Sentechtipvn</h3><div style="margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; background: var(--color-input-bg); padding: 10px; border-radius: 14px;"><span style="font-weight: 600;" id="txtVisionStroke"></span> <label class="switch" style="margin: 0;"><input type="checkbox" id="strokeToggle"><span class="slider"></span></label></div><div style="margin-bottom: 14px;"><label id="lblMarkStyle"></label><select id="markStyle" class="input-num"><option value="0">Liquid Glass</option><option value="1">Crystal Shine</option><option value="2">Holographic</option><option value="3">Matte Dark</option><option value="4">Classic Glossy</option></select></div><div style="margin-bottom: 14px;"><label id="lblShadowDirection"></label><div class="direction-container"><button class="dir-btn" data-dir="left">◀︎</button><button class="dir-btn" data-dir="right">►</button><button class="dir-btn" data-dir="center">❖</button><button class="dir-btn" data-dir="top">▲</button><button class="dir-btn" data-dir="bottom">▼</button></div></div><div style="margin-bottom: 14px;"><label id="lblShadowBlur"></label><input type="number" id="shadowBlurInput" class="input-num" style="text-align:center;" value="10" min="0" max="200"></div><div style="margin-bottom: 14px;"><label id="lblShadowOffset"></label><input type="number" id="shadowOffsetInput" class="input-num" style="text-align:center;" value="10" min="-100" max="100"></div><div style="margin-bottom: 14px;"><label id="lblShadowOpacity"></label><input type="number" id="shadowOpacityInput" class="input-num" style="text-align:center;" value="30" min="0" max="100"></div><div style="margin-bottom: 14px;"><label id="lblRadiusStyle"></label><select id="radiusStyle" class="input-num"><option value="0">Squircle (Chuẩn Apple)</option><option value="1">Tròn hoàn toàn</option><option value="2">Vuông nhẹ</option></select></div><button class="close-modal" id="saveEffectBtn" style="color: #00bcd4;"></button><button class="close-modal lang-cancel" id="closeEffectBtn" style="color: #ff3b30;"></button></div></div>

</div>

<script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('./sw.js').then(reg => reg.update()); }

    const ST_KEYS = { app: 'myAppList', name: 'myAppNames', dock: 'myDockApps', mark: 'effectMarkStyle', radius: 'effectRadiusStyle', dir: 'effectShadowDirection', blur: 'effectShadowBlur', offset: 'effectShadowOffset', opacity: 'effectShadowOpacity', dockStyle: 'dockStyle', stroke: 'effectStroke', hideLab: 'hideLabels', bgDir: 'bgShadowDirection', bgBlur: 'bgShadowBlur', bgOffset: 'bgShadowOffset', bgOpacity: 'bgShadowOpacity', custom: 'customApps', haptic: 'hapticSound', cG1: 'colorGrad1', cG2: 'colorGrad2', cCont: 'colorContainer', cDock: 'colorDock' };

    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playHapticSound() {
        if (localStorage.getItem(ST_KEYS.haptic) === 'false') return;
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
    }

    function createRipple(event, button) {
        if(!button.classList.contains('ripple-wrapper')) button.classList.add('ripple-wrapper');
        const circle = document.createElement("span");
        const diameter = Math.max(button.clientWidth, button.clientHeight);
        const radius = diameter / 2;
        const rect = button.getBoundingClientRect();
        let x, y;
        if(event.touches && event.touches.length > 0) {
            x = event.touches[0].clientX - rect.left;
            y = event.touches[0].clientY - rect.top;
        } else {
            x = event.clientX - rect.left;
            y = event.clientY - rect.top;
        }
        circle.style.width = circle.style.height = `${diameter}px`;
        circle.style.left = `${x - radius}px`;
        circle.style.top = `${y - radius}px`;
        circle.classList.add("ripple");
        const existing = button.querySelector('.ripple');
        if (existing) { existing.remove(); }
        button.appendChild(circle);
        setTimeout(() => { if(circle.parentNode) circle.remove(); }, 600);
    }

    document.body.addEventListener('touchstart', function(e) {
        let target = e.target.closest('button, .app-item, .drawer-btn, .close-modal, .dir-btn');
        if(target) {
            playHapticSound();
            if(target.tagName === 'BUTTON' || target.classList.contains('close-modal')) {
                createRipple(e, target);
            }
        }
    }, {passive: true});

    const FALLBACK_DB = {};
    let appDatabase = {}, socialData = { links: { email: '', social_follow: '', plugin_shortcut: '' } }, langData = {};
    const basePath = '.';
    
    const MAX_APPS = 12, MAX_DOCK_APPS = 3;
    let isDeleteMode = false, isAddingDock = false, isFastRenameMode = false;
    
    let searchTimeout = null;
    let currentSearchLimit = 12;
    let currentLocalLimit = 12;
    let currentStore = 'vn';
    let currentQuery = '';

    const grid = document.getElementById('appGrid'), dockArea = document.getElementById('dockArea'), drawerWrapper = document.getElementById('drawerWrapper'), drawerContent = document.getElementById('drawerContent'), mainAppContainer = document.getElementById('mainAppContainer');

    Promise.all([
        fetch(basePath + '/db.json').then(res => res.json()).catch(() => FALLBACK_DB),
        fetch(basePath + '/system-app.json').then(res => res.json()).catch(() => ({})),
        fetch(basePath + '/social.json').then(res => res.json()).catch(() => socialData),
        fetch(basePath + '/Language/vi_VN.json').then(res => res.json()).catch(() => ({}))
    ]).then(([db, sysApp, social, lang]) => {
        let customApps = getVals(ST_KEYS.custom, {});
        appDatabase = { ...db, ...sysApp, ...customApps }; 
        socialData = social || socialData;
        langData = lang || {};
        applyLanguage();
        applyBackgroundEffects();
        applyGlobalIconEffectsToSettingsBtn();
        initUI();
    });

    function applyLanguage() {
        if (!langData.effects) return;
        
        document.getElementById('infoTitle').innerText = langData.info_popup?.title || 'Sentechtipvn';
        const infoDetails = document.getElementById('infoDetails');
        if (infoDetails && langData.info_popup?.details) {
            infoDetails.innerHTML = langData.info_popup.details;
            infoDetails.style.display = 'block';
        }
        
        const onboardingTitle = document.getElementById('onboardingTitle');
        if (onboardingTitle) onboardingTitle.innerText = langData.onboarding?.title || 'Sentechtipvn';
        
        const onboardingDesc = document.getElementById('onboardingDesc');
        if (onboardingDesc) onboardingDesc.innerText = langData.onboarding?.desc || 'Vui lòng thêm ứng dụng vào Màn hình chính (Add to Home Screen) để sử dụng đầy đủ tính năng!';
        
        document.getElementById('btnMail').innerText = langData.info_popup?.contact || 'Liên hệ';
        document.getElementById('btnFollow').innerText = langData.info_popup?.follow || 'Theo dõi kênh';
        document.getElementById('btnInfoDetails').innerText = langData.info_popup?.info || 'Thông tin';
        document.getElementById('txtSettingTitle').innerText = langData.effects.settings?.title || 'Sentechtipvn';
        document.getElementById('openEffectsBtn').innerText = langData.effects.settings?.effects_menu || 'Hiệu ứng Icon';
        document.getElementById('openBgEffectsBtn').innerText = langData.effects.settings?.bg_menu || 'Hiệu ứng Nền';
        document.getElementById('txtBgEffectTitle').innerText = langData.effects?.title_bg || 'Sentechtipvn';
        
        const elCg1 = document.getElementById('lblColorGrad1'); if(elCg1) elCg1.innerText = langData.effects?.color_grad1 || 'Màu nền 1:';
        const elCg2 = document.getElementById('lblColorGrad2'); if(elCg2) elCg2.innerText = langData.effects?.color_grad2 || 'Màu nền 2:';
        const elCCont = document.getElementById('lblColorContainer'); if(elCCont) elCCont.innerText = langData.effects?.color_container || 'Màu khung App:';
        const elCDock = document.getElementById('lblColorDock'); if(elCDock) elCDock.innerText = langData.effects?.color_dock || 'Màu nền Dock:';

        document.getElementById('lblBgShadowDirection').innerText = langData.effects?.shadow_direction_label || 'Hướng đổ bóng:';
        document.getElementById('lblBgShadowBlur').innerText = langData.effects?.shadow_blur_label || 'Blur:';
        document.getElementById('lblBgShadowOffset').innerText = langData.effects?.shadow_offset_label || 'Offset:';
        document.getElementById('lblBgShadowOpacity').innerText = langData.effects?.shadow_opacity_label || 'Opacity 0-100:';
        document.getElementById('saveBgEffectBtn').innerText = langData.effects?.save || 'Lưu hiệu ứng';

        document.getElementById('openDockBtn').innerText = langData.effects.settings?.dock_menu || 'Dock';
        document.getElementById('openLabelsBtn').innerText = langData.app_menu?.manage_apps || 'Quản lý Ứng dụng';
        document.getElementById('exportBtn').innerText = langData.common?.export_config || '📤 Xuất Cấu Hình';
        document.getElementById('importBtn').innerText = langData.common?.import_config || '📥 Nhập';
        document.getElementById('lblLabelsTitle').innerText = langData.app_menu?.manage_apps || 'Sentechtipvn';
        document.getElementById('txtHideLabels').innerText = langData.common?.hide_app_name || 'Ẩn tên ứng dụng';
        document.getElementById('txtShowLabels').innerText = langData.common?.show_app_name || 'Hiện tên ứng dụng';
        document.getElementById('txtFastRename').innerText = langData.common?.fast_rename_mode || 'Chế độ Đổi tên nhanh';
        document.getElementById('saveLabelsBtn').innerText = langData.button?.save_config || 'Lưu cấu hình';
        document.getElementById('txtEffectTitle').innerText = langData.effects?.title || 'Sentechtipvn';
        document.getElementById('txtVisionStroke').innerText = langData.effects?.vision_stroke || 'Viền VisionOS';
        document.getElementById('lblMarkStyle').innerText = langData.effects?.mark_label || 'Kiểu Mark';
        document.getElementById('lblShadowDirection').innerText = langData.effects?.shadow_direction_label || 'Hướng đổ bóng:';
        document.getElementById('lblShadowBlur').innerText = langData.effects?.shadow_blur_label || 'Blur:';
        document.getElementById('lblShadowOffset').innerText = langData.effects?.shadow_offset_label || 'Offset:';
        document.getElementById('lblShadowOpacity').innerText = langData.effects?.shadow_opacity_label || 'Opacity 0-100:';
        document.getElementById('lblRadiusStyle').innerText = langData.effects?.radius_label || 'Kiểu Bo góc Icon';
        document.getElementById('saveEffectBtn').innerText = langData.effects?.save || 'Lưu hiệu ứng';
        document.getElementById('txtDockTitle').innerText = langData.effects.dock?.title || 'Sentechtipvn';
        document.getElementById('txtDockGlass').innerText = langData.effects.dock?.glass || 'Kính trong suốt';
        document.getElementById('txtDockWood').innerText = langData.effects.dock?.wood || 'Gỗ (iOS 6)';
        document.getElementById('txtDockBlur').innerText = langData.effects.dock?.blur || 'Mờ Đen';
        document.getElementById('txtDockDisable').innerText = langData.effects.dock?.disable || 'Tắt Dock';
        document.getElementById('saveDockBtn').innerText = langData.effects.dock?.save || 'Lưu cấu hình';
        document.querySelectorAll('.lang-close').forEach(el => el.innerText = langData.button?.close || 'Đóng');
        document.querySelectorAll('.lang-cancel').forEach(el => el.innerText = langData.button?.cancel || 'Huỷ');
        document.getElementById('txtAddAppTitle').innerText = '➕ Sentechtipvn';
        
        let loadMoreText = langData.button?.load_more || 'Xem thêm (12 App)';
        document.getElementById('btnLoadMoreOnline').innerText = loadMoreText;
        document.getElementById('btnLoadMoreLocal').innerText = loadMoreText;
        if (document.getElementById('appSearchInput')) document.getElementById('appSearchInput').placeholder = langData.modal?.search_placeholder || '🔍 Tìm kiếm trên App Store...';
    }

    function cleanIconPath(iconPath) { return iconPath ? (iconPath.includes('\\/') ? iconPath.replace(/\\\//g, '/') : iconPath) : ''; }
    function showToast(msg) { const t = document.getElementById('toast'); t.innerText = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500); }
    function getVals(key, def) { try { return JSON.parse(localStorage.getItem(key)) || def; } catch(e) { return def; } }
    function setVals(key, val) { localStorage.setItem(key, JSON.stringify(val)); }
    
    function getIconStyles() {
        const mark = localStorage.getItem(ST_KEYS.mark) || '0';
        const sDir = localStorage.getItem(ST_KEYS.dir) || 'bottom';
        const radius = localStorage.getItem(ST_KEYS.radius) || '0';
        const sBlur = localStorage.getItem(ST_KEYS.blur) || '10';
        const sOff = localStorage.getItem(ST_KEYS.offset) || '10';
        
        let opRaw = parseFloat(localStorage.getItem(ST_KEYS.opacity));
        if (isNaN(opRaw)) opRaw = 30;
        const sOp = Math.max(0, Math.min(100, opRaw)) / 100;
        
        const stroke = localStorage.getItem(ST_KEYS.stroke) === 'true';
        let radCSS = radius === '1' ? '50%' : radius === '2' ? '12px' : '16px';
        let ox = sDir==='left'? -sOff : sDir==='right'? sOff : 0;
        let oy = sDir==='top'? -sOff : sDir==='bottom'? sOff : 0;
        let markBg = mark==='0'?'linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.02))':mark==='1'?'linear-gradient(135deg, rgba(255,255,255,0.5) 0%, rgba(255,255,255,0.1) 50%, rgba(255,255,255,0.3) 100%)':'rgba(0,0,0,0.1)';
        
        return { radCSS, stroke, boxShadow: `${ox}px ${oy}px ${sBlur}px rgba(0,0,0,${sOp})`, markBg };
    }

        const overlay = document.getElementById('settingMarkOverlay');

            trashWrapper.classList.toggle('vision-stroke', styles.stroke);

    function applyBackgroundEffects() {
        const sDir = localStorage.getItem(ST_KEYS.bgDir) || 'bottom';
        const sBlur = localStorage.getItem(ST_KEYS.bgBlur) || '60';
        const sOff = localStorage.getItem(ST_KEYS.bgOffset) || '30';
        
        let bgOpRaw = parseFloat(localStorage.getItem(ST_KEYS.bgOpacity));
        if (isNaN(bgOpRaw)) bgOpRaw = 8;
        const sOp = Math.max(0, Math.min(100, bgOpRaw)) / 100;

        let ox = sDir==='left'? -sOff : sDir==='right'? sOff : 0;
        let oy = sDir==='top'? -sOff : sDir==='bottom'? sOff : 0;
        let shadowValue = `${ox}px ${oy}px ${sBlur}px rgba(0,0,0,${sOp})`;
        
        mainAppContainer.style.boxShadow = shadowValue;
        if(document.body.classList.contains('dock-active') && dockArea.className.indexOf('none') === -1) {
            dockArea.style.boxShadow = shadowValue;
        }
    }

    function closeDrawerSecure() { 
        drawerWrapper.classList.remove('open'); 
    }

    function createAppItem(id, data, isDockItem = false) {
        const div = document.createElement('div'); div.className = 'app-item'; div.dataset.id = id; div.dataset.zone = isDockItem ? 'dock' : 'grid';
        let dName = getVals(ST_KEYS.name, {})[id] || data.Name;
        let cleanIcon = cleanIconPath(data.icon);
        let iconSrc = cleanIcon && !cleanIcon.startsWith('http') && !cleanIcon.startsWith('/') ? basePath + '/' + cleanIcon : cleanIcon;
        const styles = getIconStyles();

        div.innerHTML = `
            <div class="icon-wrapper ${styles.stroke ? 'vision-stroke' : ''}" style="border-radius:${styles.radCSS}; box-shadow:${styles.boxShadow}; width:60px; height:60px;">
                <img class="icon-img" style="border-radius:${styles.radCSS};" src="${iconSrc}" onerror="this.style.display='none'">
                <span class="fallback-text"></span>
                <div class="mark-overlay" style="border-radius:${styles.radCSS}; background:${styles.markBg}"></div>
            </div>
            ${!isDockItem ? `<div class="app-info"><span class="app-name">${dName}</span></div>` : ''}
        `;

        div.onclick = () => {
            if (isDeleteMode) return;
            if (isFastRenameMode) renameApp(id, dName);
            else window.location.href = "shortcuts://run-shortcut?name=Open App Launcher&input=text&text=" + encodeURIComponent(id);
        };

        let startX = 0, startY = 0, isDragging = false, moved = false;
        
        div.addEventListener('touchstart', e => {
            if (!isDeleteMode) return;
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            isDragging = true;
            moved = false;
            div.style.transition = 'none';
            div.style.zIndex = '1000';
        }, {passive: true});

        div.addEventListener('touchmove', e => {
            if (!isDragging || !isDeleteMode) return;
            let currentX = e.touches[0].clientX;
            let currentY = e.touches[0].clientY;
            let diffX = currentX - startX;
            let diffY = currentY - startY;
            if (Math.abs(diffX) > 10 || Math.abs(diffY) > 10) {
                moved = true;
                div.style.transform = `translate(${diffX}px, ${diffY}px) scale(0.85)`;
                div.style.opacity = '0.8';
            }
        }, {passive: true});

        div.addEventListener('touchend', e => {
            if (!isDragging || !isDeleteMode) return;
            isDragging = false;
            
            if (moved) {
                const trash = document.getElementById('deleteTrash');
                if (trash) {
                    const trashRect = trash.getBoundingClientRect();
                    const divRect = div.getBoundingClientRect();
                    const divCenterX = divRect.left + divRect.width / 2;
                    const divCenterY = divRect.top + divRect.height / 2;

                    if (divCenterX >= trashRect.left && divCenterX <= trashRect.right &&
                        divCenterY >= trashRect.top && divCenterY <= trashRect.bottom) {
                        let arr = getVals(isDockItem ? ST_KEYS.dock : ST_KEYS.app, []);
                        arr = arr.filter(itemId => itemId !== id);
                        setVals(isDockItem ? ST_KEYS.dock : ST_KEYS.app, arr);
                        renderGrid();
                        return;
                    }
                }
            }
            
            div.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s';
            div.style.transform = '';
            div.style.opacity = '';
            div.style.zIndex = '';
        });

        return div;
    }

    function renderDock() {
        const style = localStorage.getItem(ST_KEYS.dockStyle) || 'none';
        dockArea.innerHTML = '';
        if (style === 'none') {
            document.body.classList.remove('dock-active'); dockArea.style.display = 'none'; closeDrawerSecure(); return;
        }
        document.body.classList.add('dock-active'); dockArea.style.display = 'flex';
        dockArea.className = 'dock-container dock-style-' + style;
        applyBackgroundEffects();
        
        let arr = getVals(ST_KEYS.dock, []).filter(id => Boolean(id) && appDatabase[id]).slice(0, MAX_DOCK_APPS);
        arr.forEach(id => { dockArea.appendChild(createAppItem(id, appDatabase[id], true)); });

        if (arr.length < MAX_DOCK_APPS) {
            const addBtn = document.createElement('div'); addBtn.className = 'app-item';
            addBtn.innerHTML = `<div class="icon-wrapper" style="width:60px; height:60px; display:flex; align-items:center; justify-content:center; background:rgba(255,255,255,0.2); border-radius:16px;"><span style="font-size:28px; color:#fff;">+</span></div>`;
            addBtn.onclick = () => { isAddingDock = true; currentLocalLimit = 12; renderModal(); };
            dockArea.appendChild(addBtn);
        }

        const setBtn = document.createElement('div'); setBtn.className = 'app-item'; setBtn.dataset.id = 'sys_settings';
        const styles = getIconStyles();
        
        setBtn.innerHTML = `
            <div class="icon-wrapper ${styles.stroke ? 'vision-stroke' : ''}" style="border-radius:${styles.radCSS}; box-shadow:${styles.boxShadow}; width:60px; height:60px; background:transparent;" id="dockSetInner">
                <div class="mark-overlay" style="border-radius:${styles.radCSS}; background:${styles.markBg}"></div>
                <img src="icons/icon_setting.png" onerror="this.outerHTML='⚙️'" style="width:100%; height:100%; object-fit:contain; position:relative; z-index:2; border-radius:${styles.radCSS};">
            </div>
        `;
        setBtn.onclick = () => {
            if(isDeleteMode) { toggleDeleteMode(); return; }
            if(drawerWrapper.classList.contains('open')) closeDrawerSecure();
            else {
                const rect = setBtn.getBoundingClientRect();
                drawerWrapper.style.flexDirection = 'column-reverse';
                drawerContent.style.flexDirection = 'column-reverse';
                drawerWrapper.className = 'drawer-vertical'; 
                
                drawerWrapper.style.bottom = (window.innerHeight - rect.top + 8) + 'px';
                drawerWrapper.style.left = (rect.left + rect.width / 2) + 'px';
                drawerWrapper.style.right = 'auto';
                drawerWrapper.style.transformOrigin = 'bottom center';
                drawerWrapper.style.transform = 'translateX(-50%) scale(0.5)';
                
                void drawerWrapper.offsetWidth; 
                drawerWrapper.classList.add('open');
            }
        };
        dockArea.appendChild(setBtn);
    }

    function renderGrid() {
        grid.innerHTML = '';
        document.body.classList.toggle('hide-labels', localStorage.getItem(ST_KEYS.hideLab) === 'true');
        
        let rawList = getVals(ST_KEYS.app, []).filter(Boolean);
        let appList = rawList.filter(id => appDatabase[id]).slice(0, MAX_APPS);
        
        appList.forEach(id => { grid.appendChild(createAppItem(id, appDatabase[id])); });
        
        if (appList.length < MAX_APPS) {
            let isEmpty = appList.length === 0;
            let addLabel = isEmpty ? (langData.button?.add_first_app || 'Thêm ứng dụng') : (langData.button?.add || 'Thêm');
            
            const addBtn = document.createElement('div'); addBtn.className = 'app-item';
            addBtn.innerHTML = `
                <div class="icon-wrapper ${isEmpty ? 'wiggle-effect' : ''}" style="width:60px; height:60px; display:flex; align-items:center; justify-content:center; border:2px dashed rgba(255,255,255,0.6); border-radius:16px; background:rgba(255,255,255,0.15);">
                    <span style="font-size:32px; color:#4f46e5; font-weight:300;">+</span>
                </div>
                <div class="app-info"><span class="app-name">${addLabel}</span></div>
            `;

        }

    function toggleDeleteMode() {
        isDeleteMode = !isDeleteMode;
        document.body.classList.toggle('delete-mode', isDeleteMode);
        
        const delBtn = document.getElementById('btnDelete');
        if (delBtn) {
            delBtn.innerHTML = isDeleteMode ? '<span style="font-size:18px; color:#34c759;">✅</span>' : '<img src="icons/icon_delete.png" onerror="this.outerHTML=\'🗑️\'" />';
        }
        
        if (isDeleteMode) closeDrawerSecure();
        renderGrid();
    }

    function searchOnlineApps(query) {
        currentQuery = query;
        const ml = document.getElementById('modalList');
        const btnMoreOnline = document.getElementById('btnLoadMoreOnline');
        const btnMoreLocal = document.getElementById('btnLoadMoreLocal');
        
        btnMoreLocal.style.display = 'none';
        if (!query.trim()) { renderModalList(); return; }

        if(currentSearchLimit === 12) ml.innerHTML = '<div style="grid-column: span 4; text-align: center; color: #666; font-size: 14px; padding: 20px;">🔍 Đang tìm kiếm...</div>';
        btnMoreOnline.style.display = 'none';

        fetch(`https://itunes.apple.com/search?term=${encodeURIComponent(query)}&country=${currentStore}&entity=software&limit=${currentSearchLimit}`)
            .then(res => res.json())
            .then(data => {
                ml.innerHTML = '';
                if (!data.results || data.results.length === 0) {
                    ml.innerHTML = '<div style="grid-column: span 4; text-align: center; color: #888; font-size: 14px; padding: 20px;">Không tìm thấy ứng dụng!</div>';
                    return;
                }
                data.results.forEach(app => {
                    const bundleId = app.bundleId;
                    let appName = app.trackName;
                    
                    appName = appName.split(':')[0].split('-')[0].split('–')[0].split('/')[0].split('"')[0].split(',')[0].trim();
                    
                    const iconUrl = app.artworkUrl512 || app.artworkUrl100;
                    appDatabase[bundleId] = { Name: appName, icon: iconUrl };
                    
                    const item = document.createElement('div'); item.className = 'app-item';
                    item.innerHTML = `<div class="icon-wrapper" style="width:50px; height:50px; border-radius:12px; box-shadow: var(--shadow-box);"><img src="${iconUrl}" class="icon-img"></div><span style="display:block; font-size:10px; margin-top:6px; text-align:center; width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding: 0 4px; box-sizing:border-box;">${appName}</span>`;
                    item.onclick = () => selectAppToAdd(bundleId);
                    ml.appendChild(item);
                });
                
                if(data.results.length === currentSearchLimit) btnMoreOnline.style.display = 'block';
            })
            .catch(() => { ml.innerHTML = '<div style="grid-column: span 4; text-align: center; color: #ff3b30; font-size: 13px;">Lỗi mạng!</div>'; });
    }

    function selectAppToAdd(id) {
        let arr = getVals(isAddingDock ? ST_KEYS.dock : ST_KEYS.app, []).filter(savedId => Boolean(savedId) && appDatabase[savedId]); 
        let maxLimitMsg = (langData.modal?.max_apps_limit || "Bạn chỉ có thể thêm tối đa {max} ứng dụng.").replace('{max}', isAddingDock ? MAX_DOCK_APPS : MAX_APPS);
        if(arr.length >= (isAddingDock ? MAX_DOCK_APPS : MAX_APPS)) return showToast(maxLimitMsg);
        
        arr.push(id); 
        setVals(isAddingDock ? ST_KEYS.dock : ST_KEYS.app, arr);

        let customApps = getVals(ST_KEYS.custom, {});
        if (!customApps[id] && appDatabase[id]) {
            customApps[id] = { Name: appDatabase[id].Name, icon: appDatabase[id].icon };
            setVals(ST_KEYS.custom, customApps);
        }

        document.getElementById('addAppModal').classList.remove('active'); 
        isAddingDock = false; 
        renderGrid();
    }

    function renderModalList() {
        const ml = document.getElementById('modalList'); ml.innerHTML = '';
        document.getElementById('btnLoadMoreOnline').style.display = 'none';
        const btnMoreLocal = document.getElementById('btnLoadMoreLocal');
        
        const used = [...getVals(ST_KEYS.app, []), ...getVals(ST_KEYS.dock, [])];
        const availableApps = Object.keys(appDatabase).filter(id => !used.includes(id));
        
        availableApps.slice(0, currentLocalLimit).forEach(id => {
            const item = document.createElement('div'); item.className = 'app-item';
            let cleanIcon = cleanIconPath(appDatabase[id].icon);
            item.innerHTML = `<div class="icon-wrapper" style="width:50px; height:50px; border-radius:12px; box-shadow: var(--shadow-box);"><img src="${cleanIcon}" class="icon-img" onerror="this.style.display='none'"></div><span style="display:block; font-size:10px; margin-top:6px; text-align:center; width:100%; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding: 0 4px; box-sizing:border-box;">${appDatabase[id].Name}</span>`;
            item.onclick = () => selectAppToAdd(id);
            ml.appendChild(item);
        });

        if(availableApps.length > currentLocalLimit) btnMoreLocal.style.display = 'block';
        else btnMoreLocal.style.display = 'none';
    }

    function renderModal() {
        document.getElementById('appSearchInput').value = '';
        currentQuery = '';
        currentLocalLimit = 12;
        renderModalList();
        document.getElementById('addAppModal').classList.add('active');
    }

    function renameApp(id, old) {
        let msg = langData.messages?.prompt_rename_app || 'Nhập tên mới:';

        if(n !== null) { let dict = getVals(ST_KEYS.name, {}); n.trim() ? dict[id] = n.trim() : delete dict[id]; setVals(ST_KEYS.name, dict); renderGrid(); }
    }

            localStorage.setItem(ST_KEYS.dockStyle, style);
            document.getElementById('dockModal').classList.remove('active'); renderGrid(); showToast(langData.messages?.toast_saved || "Đã lưu thành công");
        };

        document.getElementById('saveLabelsBtn').onclick = () => {
            localStorage.setItem(ST_KEYS.hideLab, document.getElementById('hideLabelsToggle').checked);
            localStorage.setItem(ST_KEYS.haptic, document.getElementById('hapticSoundToggle').checked);
            isFastRenameMode = document.getElementById('fastRenameToggle').checked; 
            document.getElementById('labelsModal').classList.remove('active'); renderGrid(); showToast(langData.messages?.toast_saved || "Đã lưu thành công");
        };

        document.querySelectorAll('.close-modal').forEach(btn => { 
            if(btn.id.includes('close') || btn.id.includes('Close')) { btn.onclick = (e) => e.target.closest('.modal-overlay').classList.remove('active'); }
        });

        document.getElementById('exportBtn').onclick = () => {
            const data = { apps: getVals(ST_KEYS.app,[]), dock: getVals(ST_KEYS.dock,[]), names: getVals(ST_KEYS.name,{}), eff: { mark: localStorage.getItem(ST_KEYS.mark), rad: localStorage.getItem(ST_KEYS.radius), dir: localStorage.getItem(ST_KEYS.dir), blur: localStorage.getItem(ST_KEYS.blur), off: localStorage.getItem(ST_KEYS.offset), op: localStorage.getItem(ST_KEYS.opacity), dk: localStorage.getItem(ST_KEYS.dockStyle), st: localStorage.getItem(ST_KEYS.stroke), hl: localStorage.getItem(ST_KEYS.hideLab), bgDir: localStorage.getItem(ST_KEYS.bgDir), bgBlur: localStorage.getItem(ST_KEYS.bgBlur), bgOff: localStorage.getItem(ST_KEYS.bgOff), bgOp: localStorage.getItem(ST_KEYS.bgOpacity), hp: localStorage.getItem(ST_KEYS.haptic), cG1: localStorage.getItem(ST_KEYS.cG1), cG2: localStorage.getItem(ST_KEYS.cG2), cCont: localStorage.getItem(ST_KEYS.cCont), cDock: localStorage.getItem(ST_KEYS.cDock) }};
            navigator.clipboard.writeText(btoa(encodeURIComponent(JSON.stringify(data)))).then(() => { document.getElementById('settingsModal').classList.remove('active'); showToast(langData.messages?.toast_copied || "Đã sao chép"); });
        };
        
        document.getElementById('importBtn').onclick = () => {
            let code = prompt(langData.messages?.prompt_import_code || "Dán mã cấu hình của bạn vào đây:"); if(!code) return;
            try {
                let d = JSON.parse(decodeURIComponent(atob(code)));
                if(d.apps) setVals(ST_KEYS.app, d.apps); if(d.dock) setVals(ST_KEYS.dock, d.dock); if(d.names) setVals(ST_KEYS.name, d.names);
                if(d.eff) { localStorage.setItem(ST_KEYS.mark, d.eff.mark||'0'); localStorage.setItem(ST_KEYS.radius, d.eff.rad||'0'); localStorage.setItem(ST_KEYS.dir, d.eff.dir||'bottom'); localStorage.setItem(ST_KEYS.blur, d.eff.blur||'10'); localStorage.setItem(ST_KEYS.offset, d.eff.off||'10'); localStorage.setItem(ST_KEYS.opacity, d.eff.op||'30'); localStorage.setItem(ST_KEYS.dockStyle, d.eff.dk||'none'); localStorage.setItem(ST_KEYS.stroke, d.eff.st||'false'); localStorage.setItem(ST_KEYS.hideLab, d.eff.hl||'false'); localStorage.setItem(ST_KEYS.bgDir, d.eff.bgDir||'bottom'); localStorage.setItem(ST_KEYS.bgBlur, d.eff.bgBlur||'60'); localStorage.setItem(ST_KEYS.bgOffset, d.eff.bgOff||'30'); localStorage.setItem(ST_KEYS.bgOpacity, d.eff.bgOp||'8'); localStorage.setItem(ST_KEYS.haptic, d.eff.hp||'true'); localStorage.setItem(ST_KEYS.cG1, d.eff.cG1||'#d4bbfc'); localStorage.setItem(ST_KEYS.cG2, d.eff.cG2||'#8ec5fc'); localStorage.setItem(ST_KEYS.cCont, d.eff.cCont||'#ffffff'); localStorage.setItem(ST_KEYS.cDock, d.eff.cDock||'#ffffff'); }
                document.getElementById('settingsModal').classList.remove('active'); showToast(langData.messages?.toast_success || "Thành công!"); setTimeout(() => location.reload(), 1000);
            } catch(e) { alert(langData.messages?.toast_error || "Có lỗi xảy ra!"); }
        };

        renderGrid();
        
        const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
        if (!isStandalone) {
            setTimeout(() => {
                document.getElementById('onboardingModal').classList.add('active');
            }, 15000);
        }
    }
</script>
</body>
</html>
