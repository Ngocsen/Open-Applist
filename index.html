<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Snowboard" />
    <meta name="format-detection" content="telephone=no" />
    
    <link rel="manifest" href="manifest.json" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />

    <!-- LIÊN KẾT CSS RIÊNG -->
    <link rel="stylesheet" href="css/style.css" />

    <title>Snowboard</title>
</head>
<body>

<div class="app-container">
    <div class="app-grid" id="appGrid"></div>
    <!-- Thêm Dock vào đây -->
    <div id="dockArea" class="dock-container"></div>
</div>

<button id="infoBtn" aria-label="Thông tin">i</button>

<div id="drawerWrapper">
    <div id="drawerContent">
        <button class="drawer-btn" id="btnEffect" aria-label="Cài đặt hiệu ứng"><img src="icons/icon_setting.png" onerror="this.outerHTML='🎨'" /></button>
        <button class="drawer-btn" id="btnReset" aria-label="Khôi phục cài đặt"><img src="icons/icon_reset.png" onerror="this.outerHTML='🔄'" /></button>
        <button class="drawer-btn" id="btnPlugin" aria-label="Plugin"><img src="icons/icon_plugin.png" onerror="this.outerHTML='🔌'" /></button>
        <button class="drawer-btn" id="btnDelete" aria-label="Xoá ứng dụng"><img src="icons/icon_delete.png" onerror="this.outerHTML='🗑️'" /></button>
        <button class="drawer-btn" id="btnSettings" aria-label="Mở cài đặt"><img src="icons/icon_setting.png" onerror="this.outerHTML='⚙️'" /></button>
    </div>
    <button id="drawerToggle" aria-label="Mở menu"><img src="icons/icon_setting.png" onerror="this.outerHTML='⚙️'" /></button>
</div>

<!-- Modal: Menu Cài đặt -->
<div class="modal-overlay" id="settingsModal">
    <div class="modal-content">
        <h3 id="settingsTitle">Cài đặt</h3>
        <button class="close-modal" id="openEffectsBtn" style="margin-top: 0;">Icons Effects</button>
        <button class="close-modal" id="openDockBtn">Dock</button>
        <button class="close-modal" id="closeSettingsBtn">Đóng</button>
    </div>
</div>

<!-- Modal: Chỉnh Dock -->
<div class="modal-overlay" id="dockModal">
    <div class="modal-content">
        <h3 id="dockTitle">Dock</h3>
        <div style="margin-bottom: 10px;">
            <label class="switch">
                <input type="checkbox" id="dockGlassToggle">
                <span class="slider"></span>
            </label>
            <span id="dockGlassLabel">Dock Kính trong suốt</span>
        </div>
        <div style="margin-bottom: 10px;">
            <label class="switch">
                <input type="checkbox" id="dockWoodToggle">
                <span class="slider"></span>
            </label>
            <span id="dockWoodLabel">Dock Gỗ (iOS 6)</span>
        </div>
        <div style="margin-bottom: 10px;">
            <label class="switch">
                <input type="checkbox" id="dockBlurToggle">
                <span class="slider"></span>
            </label>
            <span id="dockBlurLabel">Dock Mờ Đen</span>
        </div>
        <button class="close-modal" id="saveDockBtn">Lưu hiệu ứng</button>
        <button class="close-modal" id="closeDockBtn">Huỷ</button>
    </div>
</div>

<!-- Modal: Thông tin -->
<div class="modal-overlay" id="infoModal">
    <div class="modal-content">
        <h3 id="infoModalTitle">Sentechtipsvn</h3>
        <div class="action-list" style="display: flex; flex-direction: column; gap: 10px;">
            <button class="close-modal" id="btnMail" style="margin-top: 0;">Liên hệ</button>
            <button class="close-modal" id="btnFollow" style="margin-top: 0;">Theo dõi kênh</button>
            <button class="close-modal" id="btnInfoDetails" style="margin-top: 0;">Thông tin</button>
        </div>
        <button class="close-modal" id="closeInfoModalBtn">Đóng</button>
    </div>
</div>

<!-- Modal: Hiệu ứng Icon -->
<div class="modal-overlay" id="effectModal">
    <div class="modal-content">
        <h3 id="effectTitle">Hiệu ứng Icon</h3>
        
        <div class="control-group" style="margin-bottom: 16px;">
            <label id="markLabel" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px;">Kiểu Mark</label>
            <select id="markStyle" style="width: 100%; padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.5); background: var(--color-input-bg); font-size: 14px;">
                <option value="0">Liquid Glass</option>
                <option value="1">Crystal Shine</option>
                <option value="2">Holographic</option>
                <option value="3">Matte Dark</option>
                <option value="4">Classic Glossy</option>
            </select>
        </div>

        <div class="control-group" style="margin-bottom: 16px;">
            <label id="shadowLabel" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px;">Hướng đổ bóng</label>
            <div class="direction-container" id="shadowDirectionContainer">
                <button class="dir-btn" data-dir="center">🎯</button>
                <button class="dir-btn" data-dir="left">⬅️</button>
                <button class="dir-btn" data-dir="right">➡️</button>
                <button class="dir-btn" data-dir="top">⬆️</button>
                <button class="dir-btn" data-dir="bottom">⬇️</button>
            </div>
        </div>

        <div class="input-group" style="margin-bottom: 16px;">
            <label id="shadowBlurLabel" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px;">Độ đậm nhạt (Blur)</label>
            <input type="number" id="shadowBlurInput" class="input-num" min="1" max="100" value="10">
            <div class="input-help" id="shadowBlurHelper">Chỉ được phép nhập từ 1 đến 100</div>
        </div>

        <div class="input-group" style="margin-bottom: 16px;">
            <label id="shadowOffsetLabel" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px;">Độ xa gần (Offset)</label>
            <input type="number" id="shadowOffsetInput" class="input-num" min="1" max="100" value="10">
            <div class="input-help" id="shadowOffsetHelper">Chỉ được phép nhập từ 1 đến 100</div>
        </div>

        <div class="input-group" style="margin-bottom: 16px;">
            <label id="shadowOpacityLabel" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px;">Độ đậm (Opacity)</label>
            <input type="number" id="shadowOpacityInput" class="input-num" min="1" max="100" value="30">
            <div class="input-help" id="shadowOpacityHelper">Chỉ được phép nhập từ 1 đến 100</div>
        </div>
        
        <div class="control-group" style="margin-bottom: 16px;">
            <label id="radiusLabel" style="display: block; font-size: 14px; font-weight: 600; margin-bottom: 6px;">Kiểu Bo góc Icon</label>
            <select id="radiusStyle" style="width: 100%; padding: 12px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.5); background: var(--color-input-bg); font-size: 14px;">
                <option value="0">Squircle (Chuẩn Apple)</option>
                <option value="1">Tròn hoàn toàn</option>
                <option value="2">Vuông nhẹ</option>
            </select>
        </div>
        
        <button class="close-modal" id="saveEffectBtn">Lưu hiệu ứng</button>
        <button class="close-modal" id="closeEffectBtn">Huỷ</button>
    </div>
</div>

<!-- Modal: Thêm ứng dụng -->
<div class="modal-overlay" id="addAppModal">
    <div class="modal-content">
        <h3 id="modalTitle">➕ Thêm ứng dụng</h3>
        <input type="text" class="search-box" id="searchBox" placeholder="Tìm kiếm..." oninput="searchAppsStatic(this.value)" />
        <div class="modal-list" id="modalList"></div>
        <button id="loadMoreBtn">Xem thêm</button>
        <button class="close-modal" id="closeModalBtn">Đóng</button>
    </div>
</div>

<div class="context-menu" id="contextMenu">
    <div class="menu-item" id="menuMoveTop">Đưa lên đầu</div>
    <div class="menu-item" id="menuRename">Đổi tên</div>
    <div class="menu-item delete" id="menuDelete">Xoá</div>
</div>

<script>
    // Dữ liệu dự phòng (chỉ dùng khi không load được db.json)
    const FALLBACK_DB = { "vn.com.vng.zingalo": {"Name":"Zalo","icon":"https://is1-ssl.mzstatic.com/image/thumb/Purple221/v4/a6/fd/de/a6fdde29-8d09-cd61-d8e9-bd5293b9cf21/AppIcon-0-0-1x_U007emarketing-0-8-0-85-220.png/100x100bb.png"} };
    const FALLBACK_SOCIAL = { "links": { "email": "mailto:sentechtips@gmail.com", "social_follow": "https://browse.shortcuty.app/user/Sentechtipsvn", "plugin_shortcut": "https://www.icloud.com/shortcuts/bb6320058d1c46639372d41628ea2432", "app_info": "Snowboard v2.0\nPhát hành bởi: Sentechtipsvn" } };
    const FALLBACK_LANG = { "button": { "add": "Thêm", "close": "Đóng", "cancel": "Huỷ" }, "modal": { "title_add_app": "➕ Thêm ứng dụng" }, "effects": { "title": "Hiệu ứng Icon", "mark_label": "Kiểu Mark", "shadow_label": "Hướng đổ bóng", "radius_label": "Kiểu Bo góc", "save": "Lưu hiệu ứng", "cancel": "Huỷ", "settings": { "title": "Cài đặt", "effects_menu": "Icons Effects", "dock_menu": "Dock" }, "dock": { "title": "Dock", "glass": "Dock Kính trong suốt", "wood": "Dock Gỗ (iOS 6)", "blur": "Dock Mờ Đen", "save": "Lưu hiệu ứng", "cancel": "Huỷ" } } };

    let appDatabase = {}, socialData = { links: {} }, langData = {};
    const basePath = '.';
    const sysLang = (navigator.language || 'en-US').replace('-', '_');
    const baseLang = sysLang.split('_')[0];
    const langCandidates = [sysLang, baseLang, 'en_US', 'en'];

    async function getBestLang() {
        for (let lang of langCandidates) {
            try { const res = await fetch(basePath + '/Language/' + lang + '.json'); if (res.ok) return await res.json(); } catch (e) {}
        }
        return null;
    }

    Promise.all([
        fetch(basePath + '/db.json').then(res => res.ok ? res.json() : Promise.reject('DB 404')).catch(() => FALLBACK_DB),
        fetch(basePath + '/system-app.json').then(res => res.ok ? res.json() : Promise.reject('Sys 404')).catch(() => ({})),
        fetch(basePath + '/social.json').then(res => res.ok ? res.json() : Promise.reject('Social 404')).catch(() => FALLBACK_SOCIAL),
        getBestLang()
    ]).then(([db, sysApp, social, lang]) => {
        appDatabase = { ...db, ...sysApp };
        socialData = social || FALLBACK_SOCIAL;
        langData = lang || FALLBACK_LANG;
        initUI();
    }).catch(error => {
        console.warn("Lỗi dữ liệu:", error);
        appDatabase = FALLBACK_DB; socialData = FALLBACK_SOCIAL; langData = FALLBACK_LANG;
        initUI();
    });

    function t(key) {
        if (!langData) return key;
        const keys = key.split('.');
        let val = langData;
        for (let k of keys) { if (val && val[k] !== undefined) val = val[k]; else return key; }
        return typeof val === 'string' ? val : key;
    }

    const STORAGE_KEY = 'myAppList';
    const STORAGE_NAME_KEY = 'myAppNames';
    const STORAGE_CUSTOM_KEY = 'myCustomApps';
    const MARK_KEY = 'effectMarkStyle';
    const SHADOW_KEY = 'effectShadowStyle';
    const RADIUS_KEY = 'effectRadiusStyle';
    const SHADOW_DIRECTION_KEY = 'effectShadowDirection';
    const SHADOW_BLUR_KEY = 'effectShadowBlur';
    const SHADOW_OFFSET_KEY = 'effectShadowOffset';
    const SHADOW_OPACITY_KEY = 'effectShadowOpacity';
    const DOCK_STYLE_KEY = 'dockStyle';
    const MAX_APPS = 12;
    const INITIAL_DISPLAY_COUNT = 12;
    let currentDisplayCount = INITIAL_DISPLAY_COUNT;
    let currentSelectedAppId = null;
    let isMenuOpen = false;
    let isDeleteMode = false;

    const grid = document.getElementById('appGrid');
    const modal = document.getElementById('addAppModal');
    const modalList = document.getElementById('modalList');
    const dockArea = document.getElementById('dockArea');

    function getCustomApps() {
        const stored = localStorage.getItem(STORAGE_CUSTOM_KEY);
        return stored ? JSON.parse(stored) : [];
    }
    function getCustomNames() {
        const stored = localStorage.getItem(STORAGE_NAME_KEY);
        return stored ? JSON.parse(stored) : {};
    }
    function getSelectedApps() {
        const stored = localStorage.getItem(STORAGE_KEY);
        if (stored) { try { const parsed = JSON.parse(stored); if (Array.isArray(parsed)) return parsed; } catch(e) { localStorage.removeItem(STORAGE_KEY); } }
        return [];
    }
    function saveSelectedApps(ids) { localStorage.setItem(STORAGE_KEY, JSON.stringify(ids)); renderGrid(); closeContextMenu(); }

    function renderDock() {
        const currentStyle = localStorage.getItem(DOCK_STYLE_KEY) || 'none';
        if (currentStyle === 'none') { dockArea.innerHTML = ''; dockArea.className = 'dock-container'; return; }
        
        const ids = getSelectedApps().slice(0, 4);
        const customApps = getCustomApps();
        dockArea.className = 'dock-container dock-style-' + currentStyle;
        dockArea.innerHTML = '';
        
        ids.forEach(id => {
            let data = appDatabase[id];
            if (!data) { const found = customApps.find(a => a.bundleId === id); if (found) data = found; }
            if (!data) return;
            const useIcon = data.icon && data.icon.trim() !== "";
            let iconSrc = data.icon; if (iconSrc && !iconSrc.startsWith('http') && !iconSrc.startsWith('/')) iconSrc = basePath + '/' + iconSrc;
            const div = document.createElement('div'); div.className = 'app-item';
            div.innerHTML = `<div class="icon-wrapper" style="width: 60px; height: 60px;"><img class="icon-img" src="${useIcon ? iconSrc : ''}" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';"><span class="fallback-text" style="display:none;">${data.Name.charAt(0).toUpperCase()}</span></div>`;
            div.onclick = () => openApp(id);
            dockArea.appendChild(div);
        });
    }

    function createAppItem(id, data) { /* ... Giữ nguyên logic cũ ... */ }

    function renderGrid() { /* ... Giữ nguyên logic cũ ... */ renderDock(); }

    // Các hàm xử lý khác giữ nguyên

    function initUI() {
        // Gán ngôn ngữ cho các phần tử HTML tĩnh (Dock & Settings)
        document.getElementById('settingsTitle').innerText = t('effects.settings.title');
        document.getElementById('openEffectsBtn').innerText = t('effects.settings.effects_menu');
        document.getElementById('openDockBtn').innerText = t('effects.settings.dock_menu');
        document.getElementById('dockTitle').innerText = t('effects.dock.title');
        document.getElementById('dockGlassLabel').innerText = t('effects.dock.glass');
        document.getElementById('dockWoodLabel').innerText = t('effects.dock.wood');
        document.getElementById('dockBlurLabel').innerText = t('effects.dock.blur');
        document.getElementById('saveDockBtn').innerText = t('effects.dock.save');
        document.getElementById('closeDockBtn').innerText = t('effects.dock.cancel');
        
        // ... Phần còn lại của initUI giữ nguyên như bản trước ...
    }
    
    // Phần còn lại của script giữ nguyên (event listeners, service worker, v.v.)
</script>
</body>
</html>
